name: A2 DB Parity Check

# A2 백필 완주 검증(BBE-50) — 시트 유효 행수 vs sheet_rows DB 행수 대조.
# 읽기 전용(SELECT/values.get 만). VPS 에서 실행(SA·DATABASE_URL 이 VPS .env 에 있음).
on:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    env:
      # tailnet 전환 스위치 (BBE-77). VPS_HOST_TS 미설정 = 기존 공인 IP = 변경 전과 100% 동일 동작.
      # 롤백 = GitHub Settings→Secrets 에서 VPS_HOST_TS 삭제 1번(PR·머지 불요).
      VPS_TARGET_HOST: ${{ secrets.VPS_HOST_TS || secrets.VPS_HOST }}
      VPS_FALLBACK_HOST: ${{ secrets.VPS_HOST }}
      # ⚠️ steps.if 는 secrets 컨텍스트를 못 읽는다 — 거기서 secrets 를 참조하면
      #    "Unrecognized named-value: 'secrets'" 파싱 에러로 워크플로 전체가 무효가 된다.
      #    그래서 잡 레벨 env 로 승격해 env. 로 검사한다.
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      # Setup SSH 앞에 와야 한다 — tailnet 라우트가 먼저 올라와야 ssh 가 100.x 로 붙는다.
      # Secrets 미설정이면 스텝 스킵 + 접속 대상도 공인 IP → 동작이 바뀌지 않는다.
      - name: Tailscale (Secrets 미설정 시 스킵)
        if: env.TS_OAUTH_CLIENT_ID != ''
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Run A2 db-parity check on VPS
        run: |
          REMOTE=$(cat <<'REMOTE_EOF'
          set -e
          cd /opt/salespt-log
          node scripts/ops/a2-db-parity.mjs
          REMOTE_EOF
          )
          set +e
          for i in 1 2 3 4 5 6 7; do
            rc=0
            ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
                -i ~/.ssh/id_ed25519 "root@$VPS_TARGET_HOST" "bash -s" <<<"$REMOTE"
            rc=$?
            if [ "$rc" = "0" ]; then exit 0; fi
            if [ "$rc" = "255" ]; then
              echo "ssh 연결 실패(rc=255) — 시도 $i/7, 30초 후 재시도" >&2
              sleep 30
            else
              echo "검증 스크립트 실패(rc=$rc) — 재시도 안 함" >&2
              exit "$rc"
            fi
          done
          echo "ssh 7회 모두 실패 — VPS 도달성 지속 장애, 시간대 이격 후 재실행 권장" >&2
          exit 1
