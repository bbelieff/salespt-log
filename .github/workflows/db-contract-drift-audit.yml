name: DB Contract Drift Audit

# 파일럿 02 계약 — 시트 vs DB 드리프트 읽기 전용 계수 (결정함 9번 1단계 · BBE-50 후속).
# VPS 에서 실행(SA·DATABASE_URL 이 VPS .env 에 있음). SELECT/values.get 만 — 쓰기 0.
on:
  workflow_dispatch:
    inputs:
      cohort:
        description: "기수 라벨 콤마목록(선택) — 비우면 파일럿 전 기수 자동(8·9·연습·아레나)"
        required: false
        default: ""

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Run drift audit on VPS
        env:
          COHORT: ${{ inputs.cohort }}
        run: |
          REMOTE=$(cat <<'REMOTE_EOF'
          set -e
          cd /opt/salespt-log
          FLAGS=""
          if [ -n "$COHORT_ARG" ]; then FLAGS="--cohort $COHORT_ARG"; fi
          node scripts/ops/db-contract-drift-audit.mjs $FLAGS
          REMOTE_EOF
          )
          set +e
          for i in 1 2 3 4 5 6 7; do
            rc=0
            ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
                -i ~/.ssh/id_ed25519 "root@${{ secrets.VPS_HOST }}" \
                "COHORT_ARG=\"$COHORT\" bash -s" <<<"$REMOTE"
            rc=$?
            if [ "$rc" = "0" ]; then exit 0; fi
            if [ "$rc" = "255" ]; then
              echo "ssh 연결 실패(rc=255) — 시도 $i/7, 30초 후 재시도" >&2
              sleep 30
            else
              echo "감사 스크립트 실패(rc=$rc) — 재시도 안 함" >&2
              exit "$rc"
            fi
          done
          echo "ssh 7회 모두 실패 — VPS 도달성 지속 장애, 시간대 이격 후 재실행 권장" >&2
          exit 1
