name: DB Contract Drift Audit

# 파일럿 02 계약 — 시트 vs DB 드리프트 읽기 전용 계수 (결정함 9번 1단계 · BBE-50 후속).
# VPS 에서 실행(SA·DATABASE_URL 이 VPS .env 에 있음). SELECT/values.get 만 — 쓰기 0.
on:
  workflow_dispatch:
    inputs:
      cohort:
        description: "기수 라벨 콤마목록(선택) — 비우면 파일럿 전 기수 자동(8·9·연습·아레나)"
        required: false
        default: ""
      list_carryover:
        description: "이월로 잡힌 계약을 전부 나열 (⑤ 는 불일치만 잡아 '둘 다 이월'을 못 본다)"
        type: boolean
        required: false
        default: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      # tailnet 전환 스위치 (BBE-77). VPS_HOST_TS 미설정 = 기존 공인 IP = 변경 전과 100% 동일 동작.
      # 롤백 = GitHub Settings→Secrets 에서 VPS_HOST_TS 삭제 1번(PR·머지 불요).
      VPS_TARGET_HOST: ${{ secrets.VPS_HOST_TS || secrets.VPS_HOST }}
      VPS_FALLBACK_HOST: ${{ secrets.VPS_HOST }}
      # ⚠️ steps.if 는 secrets 컨텍스트를 못 읽는다 — 거기서 secrets 를 참조하면
      #    "Unrecognized named-value: 'secrets'" 파싱 에러로 워크플로 전체가 무효가 된다.
      #    그래서 잡 레벨 env 로 승격해 env. 로 검사한다.
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      # Setup SSH 앞에 와야 한다 — tailnet 라우트가 먼저 올라와야 ssh 가 100.x 로 붙는다.
      # Secrets 미설정이면 스텝 스킵 + 접속 대상도 공인 IP → 동작이 바뀌지 않는다.
      - name: Tailscale (Secrets 미설정 시 스킵)
        if: env.TS_OAUTH_CLIENT_ID != ''
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Run drift audit on VPS
        env:
          COHORT: ${{ inputs.cohort }}
          LIST_CARRY: ${{ inputs.list_carryover }}
        run: |
          REMOTE=$(cat <<'REMOTE_EOF'
          set -e
          cd /opt/salespt-log
          FLAGS=""
          if [ -n "$COHORT_ARG" ]; then FLAGS="--cohort $COHORT_ARG"; fi
          if [ "$LIST_CARRY_ARG" = "true" ]; then FLAGS="$FLAGS --list-carryover"; fi
          node scripts/ops/db-contract-drift-audit.mjs $FLAGS
          REMOTE_EOF
          )
          set +e
          for i in 1 2 3 4 5 6 7; do
            rc=0
            ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
                -i ~/.ssh/id_ed25519 "root@$VPS_TARGET_HOST" \
                "COHORT_ARG=\"$COHORT\" LIST_CARRY_ARG=\"$LIST_CARRY\" bash -s" <<<"$REMOTE"
            rc=$?
            if [ "$rc" = "0" ]; then exit 0; fi
            if [ "$rc" = "255" ]; then
              echo "ssh 연결 실패(rc=255) — 시도 $i/7, 30초 후 재시도" >&2
              sleep 30
            else
              echo "감사 스크립트 실패(rc=$rc) — 재시도 안 함" >&2
              exit "$rc"
            fi
          done
          echo "ssh 7회 모두 실패 — VPS 도달성 지속 장애, 시간대 이격 후 재실행 권장" >&2
          exit 1
