name: Arena Season2 Batch

# 시즌2(A2) 셋업 배치를 VPS 에서 원격 실행(BBE-42). arena-season2-batch.mjs 는
# admin OAuth(ADMIN_DRIVE_REFRESH_TOKEN)로 Drive 시트를 복사하는데, 이 시크릿은
# deploy.yml 이 매 배포마다 VPS .env 에 주입한다(로컬 개발 PC 의 .env.local 은 갱신 안 됨) —
# 그래서 로컬에서는 invalid_grant, VPS 에서는 최신 값으로 동작한다. db-backfill.yml 과
# 동일한 SSH·재시도 패턴을 그대로 재사용(값 미출력 원칙 동일).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        options: [plan, whoami, season-row, canary, all, flip-emails, rollback-emails, dump-tail, diag-append, repair-shifted-dryrun, repair-shifted-execute]
        default: plan
      canary_name:
        description: "mode=canary 일 때만 — 대상 이름"
        required: false
        default: ""

jobs:
  batch:
    runs-on: ubuntu-latest
    env:
      VPS_TARGET_HOST: ${{ secrets.VPS_HOST_TS || secrets.VPS_HOST }}
      VPS_FALLBACK_HOST: ${{ secrets.VPS_HOST }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      # BBE-77/BBE-95: GH러너→VPS:22 간헐 차단 우회. 이 파일은 #747(5종)·#751(2종) 범위 밖에
      # 마지막으로 남아 있던 워크플로다. steps.if 는 secrets 를 못 읽으므로 잡 레벨 env 로
      # 승격한다(#747 에서 잡은 함정 — 어기면 워크플로 전체가 파싱 에러로 무효화된다).
      - name: Tailscale (Secrets 미설정 시 스킵)
        if: env.TS_OAUTH_CLIENT_ID != ''
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Run arena season2 batch on VPS
        env:
          MODE: ${{ inputs.mode }}
          CANARY_NAME: ${{ inputs.canary_name }}
        run: |
          # 인자는 원격에 env 로 전달(따옴표 안전). 값 미출력.
          REMOTE=$(cat <<'REMOTE_EOF'
          set -e
          cd /opt/salespt-log
          case "$MODE_ARG" in
            plan) FLAGS="--plan" ;;
            whoami) FLAGS="--whoami"; if [ -n "$CANARY_ARG" ]; then FLAGS="$FLAGS --canary $CANARY_ARG"; fi ;;
            season-row) FLAGS="--season-row" ;;
            canary) FLAGS="--canary $CANARY_ARG" ;;
            all) FLAGS="--all" ;;
            flip-emails) FLAGS="--flip-emails" ;;
            rollback-emails) FLAGS="--rollback-emails" ;;
            dump-tail) FLAGS="--dump-tail" ;;
            diag-append) FLAGS="--diag-append" ;;
            repair-shifted-dryrun) FLAGS="--repair-shifted" ;;
            repair-shifted-execute) FLAGS="--repair-shifted --execute" ;;
            *) echo "알 수 없는 mode: $MODE_ARG" >&2; exit 2 ;;
          esac
          node scripts/ops/arena-season2-batch.mjs $FLAGS
          REMOTE_EOF
          )
          # rc=255(도달성) 한정 재시도 15×25s(최대 ~13분) — deploy·backfill 워크플로와 동일
          # 완화, 확대판. 2026-08-06: 관측된 GH IP대역 한정 차단 창이 최대 8~10분 지속 확인 →
          # 기존 7×30s(~6분) 예산 부족, 15×25s 로 확대. IPv4 실패 시 VPS_HOST_V6(설정된 경우)
          # 교대 시도 — 프로토콜 계열 전환으로 IP대역 차단 우회 시도(SSH 장애 조사 2026-08-06).
          # 미설정이면 기존과 동일 IPv4만.
          set +e
          HOSTS=("$VPS_TARGET_HOST")
          # tailnet 사용 중이면 공인 IPv4 를 슬롯2 로 추가 → 짝수 시도가 자동 폴백.
          # VPS_HOST_TS 미설정이면 두 값이 같아 no-op(배열 = 변경 전과 동일).
          if [ "$VPS_FALLBACK_HOST" != "$VPS_TARGET_HOST" ]; then HOSTS+=("$VPS_FALLBACK_HOST"); fi
          if [ -n "${{ secrets.VPS_HOST_V6 }}" ]; then HOSTS+=("${{ secrets.VPS_HOST_V6 }}"); fi
          NHOSTS=${#HOSTS[@]}
          for i in $(seq 1 15); do
            rc=0
            HOST="${HOSTS[$(( (i - 1) % NHOSTS ))]}"
            if [[ "$HOST" == *:* ]]; then FAM=-6; TARGET="root@[$HOST]"; else FAM=-4; TARGET="root@$HOST"; fi
            ssh $FAM -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
                -i ~/.ssh/id_ed25519 "$TARGET" \
                "MODE_ARG=\"$MODE\" CANARY_ARG=\"$CANARY_NAME\" bash -s" <<<"$REMOTE"
            rc=$?
            if [ "$rc" = "0" ]; then exit 0; fi
            if [ "$rc" = "255" ]; then
              echo "ssh 연결 실패(rc=255, host=$HOST) — 시도 $i/15, 25초 후 재시도" >&2
              sleep 25
            else
              echo "배치 스크립트 실패(rc=$rc) — 재시도 안 함(멱등 재실행으로 수렴)" >&2
              exit "$rc"
            fi
          done
          echo "ssh 15회 모두 실패 — VPS 도달성 지속 장애, 시간대 이격 후 재실행 권장" >&2
          exit 1
