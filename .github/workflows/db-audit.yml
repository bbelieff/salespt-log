name: DB Audit (read-only)

# R4 실측용 **읽기 전용** 감사 — VPS 에서 지정 감사 스크립트 1개를 실행하고 로그로 결과를 남긴다.
# DB(SQL) 쓰기 없음(스크립트가 SELECT 만 수행). 임의 SQL 입력 없음 — 화이트리스트된 스크립트만 선택 가능.
# 예외 1건: slo-loop 는 앱 API 를 경유해 "연습"(더미) 계정에 한해 GET한 값을 그대로 재-POST하는
# 멱등 쓰기 1건을 수행한다(SLO "일지 저장" 경로 실측 목적, SLO_ENABLE_WRITE=0 으로 끌 수 있음) — 그 외 전부 GET.
# VPS 에서 실행하는 이유: DATABASE_URL(시크릿)과 Google SA(시트 O1 읽기) 가 **둘 다** 있는 유일한 곳.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "실행할 감사 스크립트"
        type: choice
        required: true
        options:
          - r4-week11-audit
          - dashboard-parity
          - contract-append-key-audit
          - registry-parity
          - scoreboard-parity
          - bbe120-diag
          - perf-diag
          - bbe252-cohort-readiness
          - bbe258-sales-drift
          - slo-loop
          - cache-warm-diag
      cohort:
        description: "dashboard-parity·contract-append-key-audit·scoreboard-parity 전용 — 대조할 기수 목록(쉼표 구분). 비우면 파일럿 전체 기본값."
        type: string
        required: false
        default: "8,9,연습,A1-0,A1-1,A1-2,A1-3,A1-4,A1-5,A1-6,A2-1,A2-2,A2-3,A2-4,A2-5,A2-6,A2-7,A2-8"
      user:
        description: "bbe120-diag 전용 — 대상 사용자 이메일 1명"
        type: string
        required: false
        default: ""
      mode:
        description: "bbe120-diag 전용 — 진단 모드"
        type: choice
        required: false
        options:
          - sales-rows
          - contract-row
          - meeting-row
          - sales-crosscheck
          - formula-check

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      # tailnet 전환 스위치 (BBE-77). VPS_HOST_TS 미설정 = 기존 공인 IP = 변경 전과 100% 동일 동작.
      # 롤백 = GitHub Settings→Secrets 에서 VPS_HOST_TS 삭제 1번(PR·머지 불요).
      VPS_TARGET_HOST: ${{ secrets.VPS_HOST_TS || secrets.VPS_HOST }}
      VPS_FALLBACK_HOST: ${{ secrets.VPS_HOST }}
      # ⚠️ steps.if 는 secrets 컨텍스트를 못 읽는다 — 거기서 secrets 를 참조하면
      #    "Unrecognized named-value: 'secrets'" 파싱 에러로 워크플로 전체가 무효가 된다.
      #    그래서 잡 레벨 env 로 승격해 env. 로 검사한다.
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      # Setup SSH 앞에 와야 한다 — tailnet 라우트가 먼저 올라와야 ssh 가 100.x 로 붙는다.
      # Secrets 미설정이면 스텝 스킵 + 접속 대상도 공인 IP → 동작이 바뀌지 않는다.
      - name: Tailscale (Secrets 미설정 시 스킵)
        if: env.TS_OAUTH_CLIENT_ID != ''
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # ⚠️ 이 워크플로만 아래 ssh 가 StrictHostKeyChecking=yes 라 known_hosts 가 **필수**다.
          # 기존 루프는 5회 모두 실패해도 마지막 `sleep 20` 의 rc=0 때문에 스텝이 초록으로
          # 통과했다 → known_hosts 가 빈 채로 ssh 가 host key verification 실패(rc=255)를 내고,
          # 재시도 루프가 원인 표시 없이 헛돌다 죽는다. tailnet 전환 후 tailscale 스텝이
          # 스킵/실패하면 정확히 이 시나리오가 재현되므로, 성공 여부를 명시 게이트로 올린다.
          ok=0
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "$VPS_TARGET_HOST" >> ~/.ssh/known_hosts; then ok=1; break; fi
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "❌ ssh-keyscan 5회 실패 — 호스트키를 못 얻었습니다." >&2
            echo "   이 워크플로는 StrictHostKeyChecking=yes 라 이대로면 ssh 가 반드시 실패합니다." >&2
            echo "   tailnet 사용 중이라면 Tailscale 스텝이 스킵/실패했는지 위 로그를 확인하세요." >&2
            exit 1
          fi
      - name: Run audit on VPS (read-only)
        env:
          SCRIPT: ${{ inputs.script }}
          COHORT: ${{ inputs.cohort }}
          DIAG_USER: ${{ inputs.user }}
          DIAG_MODE: ${{ inputs.mode }}
        run: |
          # 값 미출력. 스크립트명은 choice 로 제한돼 임의 실행 불가.
          # cohort 는 자유 문자열 입력이고 원격에서 **root 로 실행**되므로, ssh 로 넘기기 전에
          # 셸 메타문자를 검사해 차단한다. 원격 명령에서 작은따옴표로 감싸므로 작은따옴표만
          # 막아도 탈출은 불가능하지만, 방어적으로 치환·명령·리다이렉션 문자를 모두 막는다.
          #
          # ⚠️ 화이트리스트 정규식(`[가-힣]` 등 한글 범위)을 쓰지 않는다 — 러너의 C 로케일에서
          #    `grep: Invalid collation character` 로 죽는다(2026-08-08 run 31267555191 실측).
          #    범위 표현은 로케일 의존이라, 로케일 무관한 셸 `case` 패턴 매칭으로 대체했다.
          ARGS=""
          if [ "$SCRIPT" = "dashboard-parity" ] || [ "$SCRIPT" = "contract-append-key-audit" ] || [ "$SCRIPT" = "scoreboard-parity" ]; then
            case "$COHORT" in
              "")
                echo "❌ cohort 가 비어 있습니다." >&2; exit 1 ;;
              *[\`\$\;\&\|\<\>\(\)\{\}\[\]\!\\\"\']*)
                echo "❌ cohort 에 셸 메타문자가 포함돼 있습니다 — 중단합니다." >&2; exit 1 ;;
            esac
            ARGS="--cohort '$COHORT'"
          fi
          if [ "$SCRIPT" = "bbe120-diag" ]; then
            case "$DIAG_USER" in
              "")
                echo "❌ user 가 비어 있습니다(bbe120-diag 필수)." >&2; exit 1 ;;
              *[\`\$\;\&\|\<\>\(\)\{\}\[\]\!\\\"\']*)
                echo "❌ user 에 셸 메타문자가 포함돼 있습니다 — 중단합니다." >&2; exit 1 ;;
            esac
            case "$DIAG_MODE" in
              sales-rows|contract-row|meeting-row|sales-crosscheck|formula-check) ;;
              *)
                echo "❌ mode 가 비어 있거나 잘못됐습니다(sales-rows|contract-row|meeting-row|sales-crosscheck|formula-check)." >&2; exit 1 ;;
            esac
            ARGS="--user '$DIAG_USER' --mode '$DIAG_MODE'"
          fi
          set +e
          for i in 1 2 3 4 5 6 7; do
            ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              root@"$VPS_TARGET_HOST" \
              "cd /opt/salespt-log && node scripts/ops/${SCRIPT}.mjs ${ARGS}"
            rc=$?
            [ $rc -ne 255 ] && break
            echo "ssh 도달 실패(rc=255) — 재시도 $i/7"; sleep 30
          done
          exit $rc
