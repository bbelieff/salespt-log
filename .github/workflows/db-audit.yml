name: DB Audit (read-only)

# R4 실측용 **읽기 전용** 감사 — VPS 에서 지정 감사 스크립트 1개를 실행하고 로그로 결과를 남긴다.
# DB 쓰기 없음(스크립트가 SELECT 만 수행). 임의 SQL 입력 없음 — 화이트리스트된 스크립트만 선택 가능.
# VPS 에서 실행하는 이유: DATABASE_URL(시크릿)과 Google SA(시트 O1 읽기) 가 **둘 다** 있는 유일한 곳.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "실행할 감사 스크립트"
        type: choice
        required: true
        options:
          - r4-week11-audit
          - dashboard-parity
          - contract-append-key-audit
      cohort:
        description: "dashboard-parity·contract-append-key-audit 전용 — 대조할 기수 목록(쉼표 구분). 비우면 파일럿 전체 기본값."
        type: string
        required: false
        default: "8,9,연습,A1-0,A1-1,A1-2,A1-3,A1-4,A1-5,A1-6,A2-1,A2-2,A2-3,A2-4,A2-5,A2-6,A2-7,A2-8"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts && break || sleep 20
          done
      - name: Run audit on VPS (read-only)
        env:
          SCRIPT: ${{ inputs.script }}
          COHORT: ${{ inputs.cohort }}
        run: |
          # 값 미출력. 스크립트명은 choice 로 제한돼 임의 실행 불가.
          # cohort 는 자유 문자열 입력이고 원격에서 **root 로 실행**되므로, ssh 로 넘기기 전에
          # 셸 메타문자를 검사해 차단한다. 원격 명령에서 작은따옴표로 감싸므로 작은따옴표만
          # 막아도 탈출은 불가능하지만, 방어적으로 치환·명령·리다이렉션 문자를 모두 막는다.
          #
          # ⚠️ 화이트리스트 정규식(`[가-힣]` 등 한글 범위)을 쓰지 않는다 — 러너의 C 로케일에서
          #    `grep: Invalid collation character` 로 죽는다(2026-08-08 run 31267555191 실측).
          #    범위 표현은 로케일 의존이라, 로케일 무관한 셸 `case` 패턴 매칭으로 대체했다.
          ARGS=""
          if [ "$SCRIPT" = "dashboard-parity" ] || [ "$SCRIPT" = "contract-append-key-audit" ]; then
            case "$COHORT" in
              "")
                echo "❌ cohort 가 비어 있습니다." >&2; exit 1 ;;
              *[\`\$\;\&\|\<\>\(\)\{\}\[\]\!\\\"\']*)
                echo "❌ cohort 에 셸 메타문자가 포함돼 있습니다 — 중단합니다." >&2; exit 1 ;;
            esac
            ARGS="--cohort '$COHORT'"
          fi
          set +e
          for i in 1 2 3 4 5 6 7; do
            ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              root@"${{ secrets.VPS_HOST }}" \
              "cd /opt/salespt-log && node scripts/ops/${SCRIPT}.mjs ${ARGS}"
            rc=$?
            [ $rc -ne 255 ] && break
            echo "ssh 도달 실패(rc=255) — 재시도 $i/7"; sleep 30
          done
          exit $rc
