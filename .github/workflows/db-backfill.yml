name: DB Backfill

# 지정 기수 시트 → Supabase sheet_rows 1회 적재 (db-migration-pilot §1 P1).
# VPS 에서 실행(SA·DATABASE_URL 이 VPS .env 에 있음). 기본 dry-run — execute 체크 시에만 기록.
# 실행 로그의 "결과 표/대조 표" 가 backfill 증빙.
on:
  workflow_dispatch:
    inputs:
      cohort:
        description: "기수 라벨 (예: 8) — DB 에 스탬프할 값"
        required: true
      sheet:
        description: "시트 ID (선택) — 지정 시 그 시트만 백필(레지스트리 cohort 무관). 파일럿 편입 전 선백필용"
        required: false
        default: ""
      execute:
        description: "실제 기록 (미체크 = dry-run)"
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      # tailnet 전환 스위치 (BBE-77). VPS_HOST_TS 미설정 = 기존 공인 IP = 변경 전과 100% 동일 동작.
      # 롤백 = GitHub Settings→Secrets 에서 VPS_HOST_TS 삭제 1번(PR·머지 불요).
      VPS_TARGET_HOST: ${{ secrets.VPS_HOST_TS || secrets.VPS_HOST }}
      VPS_FALLBACK_HOST: ${{ secrets.VPS_HOST }}
      # ⚠️ steps.if 는 secrets 컨텍스트를 못 읽는다 — 거기서 secrets 를 참조하면
      #    "Unrecognized named-value: 'secrets'" 파싱 에러로 워크플로 전체가 무효가 된다.
      #    그래서 잡 레벨 env 로 승격해 env. 로 검사한다.
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      # Setup SSH 앞에 와야 한다 — tailnet 라우트가 먼저 올라와야 ssh 가 100.x 로 붙는다.
      # Secrets 미설정이면 스텝 스킵 + 접속 대상도 공인 IP → 동작이 바뀌지 않는다.
      - name: Tailscale (Secrets 미설정 시 스킵)
        if: env.TS_OAUTH_CLIENT_ID != ''
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Run backfill on VPS
        env:
          COHORT: ${{ inputs.cohort }}
          SHEET: ${{ inputs.sheet }}
          EXECUTE: ${{ inputs.execute }}
        run: |
          # 인자는 원격에 env 로 전달(따옴표 안전). 코드/URL 값 미출력.
          REMOTE=$(cat <<'REMOTE_EOF'
          set -e
          cd /opt/salespt-log
          FLAGS="--cohort $COHORT_ARG"
          if [ -n "$SHEET_ARG" ]; then FLAGS="$FLAGS --sheet $SHEET_ARG"; fi
          if [ "$EXEC_ARG" = "true" ]; then FLAGS="$FLAGS --execute"; fi
          node scripts/ops/backfill-sheet-rows.mjs $FLAGS
          REMOTE_EOF
          )
          # rc=255(도달성) 한정 재시도 15×25s(최대 ~13분) — deploy 단계와 동일 완화, 확대판.
          # 배경(2026-07-08): 아레나 backfill 이 GH러너→VPS22 간헐 차단에 3연속 단발 실패
          # (PC에선 22 열림 — GH IP 대역만 차단되는 창). 2026-08-06 재발 시 차단 창이 최대
          # 8~10분 지속 확인 → 기존 7×30s(~6분) 예산 부족, 15×25s 로 확대. IPv4 실패 시
          # VPS_HOST_V6(설정된 경우) 교대 시도 — 프로토콜 계열 전환으로 IP대역 차단 우회 시도
          # (SSH 장애 조사 2026-08-06). 미설정이면 기존과 동일 IPv4만. 스크립트 실패(다른 rc)는
          # 즉시 fail — 멱등 설계라 재실행으로 수렴.
          set +e
          HOSTS=("$VPS_TARGET_HOST")
          # tailnet 사용 중이면 공인 IPv4 를 슬롯2 로 추가 → 짝수 시도가 자동 폴백.
          # VPS_HOST_TS 미설정이면 두 값이 같아 no-op(배열 = 변경 전과 동일).
          if [ "$VPS_FALLBACK_HOST" != "$VPS_TARGET_HOST" ]; then HOSTS+=("$VPS_FALLBACK_HOST"); fi
          if [ -n "${{ secrets.VPS_HOST_V6 }}" ]; then HOSTS+=("${{ secrets.VPS_HOST_V6 }}"); fi
          NHOSTS=${#HOSTS[@]}
          for i in $(seq 1 15); do
            rc=0
            HOST="${HOSTS[$(( (i - 1) % NHOSTS ))]}"
            if [[ "$HOST" == *:* ]]; then FAM=-6; TARGET="root@[$HOST]"; else FAM=-4; TARGET="root@$HOST"; fi
            ssh $FAM -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
                -i ~/.ssh/id_ed25519 "$TARGET" \
                "COHORT_ARG=\"$COHORT\" SHEET_ARG=\"$SHEET\" EXEC_ARG=\"$EXECUTE\" bash -s" <<<"$REMOTE"
            rc=$?
            if [ "$rc" = "0" ]; then exit 0; fi
            if [ "$rc" = "255" ]; then
              echo "ssh 연결 실패(rc=255, host=$HOST) — 시도 $i/15, 25초 후 재시도" >&2
              sleep 25
            else
              echo "backfill 스크립트 실패(rc=$rc) — 재시도 안 함(멱등 재실행으로 수렴)" >&2
              exit "$rc"
            fi
          done
          echo "ssh 15회 모두 실패 — VPS 도달성 지속 장애, 시간대 이격 후 재실행 권장" >&2
          exit 1
