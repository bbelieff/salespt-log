name: DB Migrate

# lib/repo/db/migrations/*.sql 를 실제 Supabase 에 적용한다 (BBE-85).
#
# 왜 필요한가: 이 러너를 돌리는 워크플로가 **아예 없었다**. deploy.yml 은 DATABASE_URL 을
# 앱 실행 env 로 주입만 할 뿐 db:migrate 를 호출하지 않는다 — 그래서 0001·0002 가 master 에
# 머지됐는데도(#722·#738) 프로덕션 DB 에 적용됐는지 아무도 확인할 수 없었고, 유일한 경로가
# "사람이 VPS 에 SSH 로 들어가 손으로 실행"이었다. 그 SSH 마저 간헐 차단된다(BBE-77).
#
# 기본이 dry-run 이다 — execute 를 명시 체크해야만 실제 적용한다. 플래그 방향을 backfill 과
# 반대로(있으면 dry-run) 둔 이유: 러너는 인자가 없으면 **실제 적용**이라, 조건문이 어긋났을 때
# 안전한 쪽(dry-run)으로 넘어지게 하려면 --dry-run 을 붙이는 쪽이 기본이어야 한다.
#
# 멱등: 러너가 pg_advisory_lock + schema_migrations 체크섬 대조를 하므로 몇 번 돌려도 안전.
on:
  workflow_dispatch:
    inputs:
      execute:
        description: "실제 적용 (미체크 = dry-run — 대기 목록만 출력하고 종료)"
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      VPS_TARGET_HOST: ${{ secrets.VPS_HOST_TS || secrets.VPS_HOST }}
      VPS_FALLBACK_HOST: ${{ secrets.VPS_HOST }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      # BBE-77: GH러너→VPS:22 간헐 차단 우회. 이 파일은 #747(5a45762) 범위 밖이라
      # 공인 IP 전용으로 남아 있었다 — 실제로 run 31287233695 가 이 경로에서 15/15 timeout
      # 으로 13m51s 태우고 죽었다(2026-08-09 00:57~01:10Z). 마이그레이션 적용 여부 확인이
      # 그때 유실됐다. steps.if 는 secrets 를 못 읽으므로 잡 레벨 env 로 승격한다(#747 과 동일).
      - name: Tailscale (Secrets 미설정 시 스킵)
        if: env.TS_OAUTH_CLIENT_ID != ''
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Run db-migrate on VPS
        env:
          EXECUTE: ${{ inputs.execute }}
        run: |
          # 인자는 원격에 env 로 전달(따옴표 안전). DATABASE_URL 은 원격 .env 에서 스크립트가
          # 직접 읽는다 — 워크플로가 grep/export 로 만지지 않는다(2026-07-09 로그 노출 사고 회피).
          REMOTE=$(cat <<'REMOTE_EOF'
          set -e
          cd /opt/salespt-log
          FLAGS="--dry-run"
          if [ "$EXEC_ARG" = "true" ]; then FLAGS=""; fi
          node scripts/db-migrate.mjs $FLAGS
          REMOTE_EOF
          )
          # rc=255(도달성) 한정 재시도 15×25s — db-backfill.yml 과 동일 예산(2026-08-06 실측:
          # 차단 창이 최대 8~10분 지속). IPv4 실패 시 VPS_HOST_V6(설정된 경우) 교대 시도.
          # 스크립트 실패(다른 rc)는 즉시 fail — 멱등이라 재실행으로 수렴한다.
          set +e
          HOSTS=("$VPS_TARGET_HOST")
          # tailnet 사용 중이면 공인 IPv4 를 슬롯2 로 추가 → 짝수 시도가 자동 폴백.
          # VPS_HOST_TS 미설정이면 두 값이 같아 no-op(배열 = 변경 전과 동일).
          if [ "$VPS_FALLBACK_HOST" != "$VPS_TARGET_HOST" ]; then HOSTS+=("$VPS_FALLBACK_HOST"); fi
          if [ -n "${{ secrets.VPS_HOST_V6 }}" ]; then HOSTS+=("${{ secrets.VPS_HOST_V6 }}"); fi
          NHOSTS=${#HOSTS[@]}
          for i in $(seq 1 15); do
            rc=0
            HOST="${HOSTS[$(( (i - 1) % NHOSTS ))]}"
            if [[ "$HOST" == *:* ]]; then FAM=-6; TARGET="root@[$HOST]"; else FAM=-4; TARGET="root@$HOST"; fi
            ssh $FAM -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
                -i ~/.ssh/id_ed25519 "$TARGET" \
                "EXEC_ARG=\"$EXECUTE\" bash -s" <<<"$REMOTE"
            rc=$?
            if [ "$rc" = "0" ]; then exit 0; fi
            if [ "$rc" = "255" ]; then
              echo "ssh 연결 실패(rc=255, host=$HOST) — 시도 $i/15, 25초 후 재시도" >&2
              sleep 25
            else
              echo "db-migrate 실패(rc=$rc) — 재시도 안 함(멱등 재실행으로 수렴)" >&2
              exit "$rc"
            fi
          done
          echo "ssh 15회 모두 실패 — VPS 도달성 지속 장애, 시간대 이격 후 재실행 권장" >&2
          exit 1
