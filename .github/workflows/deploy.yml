name: Deploy to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      clean:
        description: "완전 클린 빌드 — npm ci 강제 + Next 빌드 캐시 미복사 (캐시 오염 탈출구)"
        type: boolean
        default: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (just to know the SHA)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 호스트키는 best-effort 로만 수집(실패해도 무방 → '|| true').
          # 과거: ssh-keyscan 을 하드 게이트로 두니, 러너↔VPS 22번의 *간헐적 연결 타임아웃*에
          #       keyscan 이 걸리면 배포 전체가 막혔다(실제 sshd 는 정상, 다른 run 은 접속 성공).
          # 현재: 실제 ssh 가 StrictHostKeyChecking=accept-new(TOFU) 로 known_hosts 없이도 접속하고,
          #       아래 Deploy 단계가 *연결 실패(rc=255)에 한해* 재시도한다.
          ssh-keyscan -T 15 -t rsa,ecdsa,ed25519 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Inject DATABASE_URL into VPS .env (idempotent, 값 미출력)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # DB 파일럿(db-migration-pilot §3 secret 원칙): 운영자가 SSH 작업 없이
          # GitHub Secrets(DATABASE_URL) 등록만으로 VPS .env 에 반영되게 한다.
          # ★값 노출 금지: echo/set -x/커맨드라인 인자 경로 일절 없음 —
          #   값은 stdin→원격 임시파일(600)로만 이동. (GH 가 secret 을 *** 마스킹하지만
          #   그것에 기대지 않고 출력 경로 자체를 만들지 않는다.)
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret 미설정 — 주입 스킵"
            exit 0
          fi
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -i $HOME/.ssh/id_ed25519"
          # 원격 편집 스크립트 — .env 의 DATABASE_URL= 줄만 제자리 교체(없으면 맨 아래 추가).
          # 다른 줄 비파괴. 값은 awk ENVIRON 경유(이스케이프 불필요·비출력). 멱등:
          # 이미 같은 값이 있어도 같은 값으로 교체될 뿐 — 재실행 안전.
          REMOTE_EDIT=$(cat <<'REMOTE_EOF'
          set -e
          cd /opt/salespt-log
          touch .env
          DATABASE_URL_VALUE="$(cat .env.dburl.tmp)" awk '
            BEGIN { u = ENVIRON["DATABASE_URL_VALUE"]; done = 0 }
            /^DATABASE_URL=/ { if (!done) { print "DATABASE_URL=" u; done = 1 }; next }
            { print }
            END { if (!done) print "DATABASE_URL=" u }
          ' .env > .env.dburl.new
          chmod 600 .env.dburl.new
          mv .env.dburl.new .env
          rm -f .env.dburl.tmp
          echo "DATABASE_URL 주입 OK (값 미출력) — .env 총 $(grep -c "" .env)줄"
          REMOTE_EOF
          )
          set +e
          # 연결 실패(rc=255) 재시도 2회 — 2026-07-07 run#426: VPS 22번 간헐 도달성
          # 장애가 단발 시도를 그대로 삼킴. Deploy 단계와 동일한 완화(짧은 버전).
          rc1=1; rc2=1
          for t in 1 2; do
            # 1) 값 전송: stdin → 원격 임시파일 (umask 077 → 600)
            printf '%s' "$DATABASE_URL" | ssh $SSH_OPTS "root@${{ secrets.VPS_HOST }}" \
              "umask 077 && cat > /opt/salespt-log/.env.dburl.tmp"
            rc1=$?
            if [ "$rc1" = "0" ]; then
              # 2) 원격 편집 실행
              ssh $SSH_OPTS "root@${{ secrets.VPS_HOST }}" "bash -s" <<<"$REMOTE_EDIT"
              rc2=$?
            fi
            if [ "$rc1" = "0" ] && [ "$rc2" = "0" ]; then break; fi
            if [ "$t" = "1" ]; then
              echo "주입 ssh 실패(rc=$rc1/$rc2) — 30초 후 1회 재시도" >&2
              sleep 30
            fi
          done
          set -e
          if [ "$rc1" != "0" ] || [ "$rc2" != "0" ]; then
            # 주입 실패는 경고만 — 배포 자체는 계속(파일럿 dual-write 는 비차단 설계).
            # 멱등이라 다음 배포에서 자동 재주입된다.
            echo "::warning::DATABASE_URL 주입 실패(rc=$rc1/$rc2) — 배포는 계속 진행"
          fi

      - name: Deploy on VPS (detached — 연결 끊겨도 원격은 끝까지 완주)
        run: |
          REMOTE='
            # 주의: 이 블록 전체가 작은따옴표로 감싸임 → 내부에 작은따옴표 절대 금지(문자열 조기 종료).
            #       따옴표가 필요하면 큰따옴표만 사용. (2026-06-16 주석 안 작은따옴표로 배포 깨질 뻔)
            set -e
            cd /opt/salespt-log
            echo "::group::Pulling"
            git fetch --all
            git reset --hard origin/master
            echo "::endgroup::"
            echo "::group::Auth env guard (로그인 보호 — 2026-06-16 사고 재발 방지)"
            # 인증 필수 env 가 비거나 유실되면 빌드·재시작 전에 즉시 실패시켜
            # 깨진 auth 빌드가 배포되는 것을 차단한다.
            # 배경: env 재구성 중 AUTH_URL 유실 → NextAuth UntrustedHost → /api/auth/* 500
            #       → 로그인 전면 다운(/ 는 200이라 겉보기 정상). 빌드·배포는 success 였음.
            #       docs/incidents/2026-06-16-auth-config-down.md
            # 검사: 키가 라인 시작 + 등호 뒤 값 1자 이상(빈값도 실패). .env.local|.env.production 둘 중 하나면 통과.
            for v in AUTH_SECRET AUTH_GOOGLE_ID AUTH_GOOGLE_SECRET AUTH_URL; do
              grep -hqE "^$v=." .env.local .env.production 2>/dev/null || {
                echo "FATAL: 필수 auth env [$v] 가 비었거나 없음 — 배포 중단(로그인 보호)"; exit 1; }
            done
            echo "auth env OK — AUTH_SECRET / AUTH_GOOGLE_ID / AUTH_GOOGLE_SECRET / AUTH_URL 모두 존재"
            echo "::endgroup::"
            echo "::group::Installing"
            # 배포 시간 단축(2026-07-08 chore/deploy-build-cache): lock 파일이 안 바뀌면
            # npm ci 스킵. 마커(.npm-ci.hash)는 untracked — git reset --hard 에 안 지워짐.
            # 탈출구: workflow_dispatch clean=true → 마커 무시하고 무조건 재설치.
            # inputs.clean 은 push 이벤트에선 빈 문자열 → "true" 아님 → 정상 캐시 경로.
            CLEAN_BUILD="${{ inputs.clean }}"
            LOCK_HASH=$(sha256sum package-lock.json | cut -d" " -f1)
            if [ "$CLEAN_BUILD" = "true" ]; then
              echo "clean=true — npm ci 강제 실행(마커 무시)"
              rm -f .npm-ci.hash
            fi
            if [ -d node_modules ] && [ -f .npm-ci.hash ] && [ "$LOCK_HASH" = "$(cat .npm-ci.hash)" ]; then
              echo "npm ci 스킵 ✅ — package-lock.json 해시 동일 ($LOCK_HASH)"
            else
              npm ci --silent
              printf "%s" "$LOCK_HASH" > .npm-ci.hash
              echo "npm ci 실행 + 해시 마커 갱신 ($LOCK_HASH)"
            fi
            echo "::endgroup::"
            echo "::group::Building (무중단 — .next-build 에 빌드, 옛 .next 보존)"
            # 빌드 OOM 방지 — VPS RAM 3.8GB. 2048MB 가 Next.js 15.5 + 이 코드베이스에 충분.
            # (4096 시 OOM-killer → BUILD_ID 누락 silent failure, 2026-05-13 사고.)
            export NODE_OPTIONS="--max-old-space-size=2048"
            export SENTRY_SUPPRESS_GLOBAL_ERROR_HANDLER_FILE_WARNING=1
            # 핵심: 옛 .next 를 지우지 않고 .next-build 에 빌드 → 빌드 4-5분 동안 옛 앱이 계속 서빙(502 0초).
            # BUILD_DIST_DIR 는 next.config.mjs 의 distDir. 런타임(next start)은 unset → 기본 .next.
            # ⚠️ 라우트 삭제 시 보존된 옛 .next/types 의 orphan route 타입 stub(삭제된 source.js import)을
            #    next build 타입체크가 include 해 "Cannot find module …route.js" 로 깨짐(2026-06-23 #448).
            #    .next/types 는 빌드타임 전용(런타임 next start 미사용) → 옛 것 제거해도 무중단 안전.
            rm -rf .next-build .next/types
            # 빌드 캐시 보존(2026-07-08): 직전 릴리스 .next/cache 를 .next-build/cache 로
            # 복사해 재활용. 같은 디스크 → cp -al(하드링크, 즉시) 우선, 실패 시 cp -a 폴백.
            # 런타임(next start)은 cache 디렉토리를 안 읽으므로 무중단·롤백(.next-prev 복원)
            # 경로에 영향 없음. clean=true 면 미복사(완전 맨땅 빌드).
            if [ "$CLEAN_BUILD" != "true" ] && [ -d .next/cache ]; then
              mkdir -p .next-build
              cp -al .next/cache .next-build/cache 2>/dev/null || cp -a .next/cache .next-build/cache
              echo "빌드 캐시 적중 ✅ — .next/cache 재활용 ($(du -sh .next-build/cache | cut -f1))"
            else
              echo "빌드 캐시 미복사 (clean=${CLEAN_BUILD:-false} 또는 직전 캐시 없음) — 맨땅 빌드"
            fi
            BUILD_DIST_DIR=.next-build npm run build
            # 새 빌드 검증 — 실패 시 swap 안 함 → 옛 .next 그대로 서빙(빌드 실패도 무중단).
            test -f .next-build/BUILD_ID || { echo "BUILD_ID 누락 — 빌드 실패, swap 안 함(무중단 유지)"; exit 1; }
            echo "::endgroup::"
            echo "::group::Atomic swap + rolling reload"
            # 원자 swap: 옛 .next → .next-prev (running 프로세스는 inode 유지로 swap 후에도 계속 서빙).
            rm -rf .next-prev
            [ -d .next ] && mv .next .next-prev
            mv .next-build .next
            # rolling reload(cluster) — 워커 하나씩 교체해 무중단 전환. reload 실패 시 restart 폴백.
            pm2 reload salespt-log --update-env || pm2 restart salespt-log --update-env
            pm2 save
            echo "::endgroup::"
            echo "::group::Health gate + 자동 롤백"
            sleep 3
            curl -sS -o /dev/null -w "Local / HTTP %{http_code}\n" http://127.0.0.1:3000
            # 필수 env 검증 — /api/health 가 AUTH_*·ADMIN_EMAILS 비면 503. env 손상으로
            # 겉보기 200·실제 다운되는 사고 재발 방지(2026-06-16). 새 빌드 기동 실패도 여기서 잡힘.
            hc=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health)
            echo "Local /api/health HTTP $hc"
            if [ "$hc" != "200" ]; then
              echo "❌ 헬스 실패(/api/health=$hc) — 이전 릴리스로 자동 롤백" >&2
              curl -sS http://127.0.0.1:3000/api/health >&2 || true
              if [ -d .next-prev ]; then
                rm -rf .next-broken; mv .next .next-broken; mv .next-prev .next
                pm2 reload salespt-log --update-env || pm2 restart salespt-log --update-env
                echo "↩ 이전 릴리스로 롤백 완료 (.next-broken 에 실패 빌드 보존)" >&2
              fi
              exit 1
            fi
            rm -rf .next-prev
            echo "새 빌드 헬스 OK (/api/health=200) — 무중단 컷오버 완료"
            echo "::endgroup::"
            echo "::group::Updates collect"
            # 새소식 자동 수집 (announcement-popup §2) — 멱등(pr 키), 실패해도
            # 배포는 성공 처리(non-blocking) → 다음 배포에서 재시도됨.
            node scripts/append-updates.mjs || echo "append-updates 실패(non-blocking) — 다음 배포에서 재시도"
            echo "::endgroup::"
          '
          # ── 실행 방식: detached(setsid) + 상태 폴링 (2026-07-09 인시던트 재발방지) ──
          # 왜: 위 $REMOTE 를 ssh 로 *동기* 실행하면, 러너↔VPS 연결이 원자 swap/health 도중
          #     끊길 때(rc=255) 원격 셸이 SIGHUP 으로 죽어 .next 가 반쯤 스왑된 손상 상태로
          #     남는다(→ 크래시 루프 → 502 사이트다운, incidents/2026-07-09-deploy-connection-
          #     drop-site-down.md). rc=255 재시도는 스크립트를 처음부터 다시 돌리지만, 도달성
          #     장애 창이 길면 재접속 자체가 다 실패해 손상 상태로 종료된다.
          # 해결: 원격 스크립트를 setsid 로 세션 분리해 띄우면 연결이 끊겨도 배포(특히 swap·
          #     health·자동롤백)가 *끝까지 완주*한다. 러너는 재접속하며 상태파일만 폴링해 진짜
          #     종료코드를 보고. flock 으로 VPS 상에서도 배포를 직렬화(GH concurrency 와 이중 안전).
          HOST="${{ secrets.VPS_HOST }}"
          RUNID="${{ github.run_id }}-${{ github.run_attempt }}"
          DIR="/opt/salespt-log/.deploy"
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i $HOME/.ssh/id_ed25519"

          # rc=255(연결 실패)만 최대 7회×20s 재시도하는 ssh 실행기. 그 외 rc 는 그대로 반환.
          # ⚠️ GH 기본 셸 bash -e 우회: 반드시 `|| rc=$?` 로 종료코드 포착(2026-06-04 교훈).
          # $2(옵션)=원격 stdin 파일 — 루프마다 재오픈되므로 재시도해도 파이프 소진 문제 없음.
          ssh_do() {
            local rc i
            for i in 1 2 3 4 5 6 7; do
              rc=0
              ssh $SSH_OPTS "root@$HOST" "$1" < "${2:-/dev/null}" || rc=$?
              [ "$rc" != "255" ] && return "$rc"
              echo "  ↻ ssh 연결 실패(rc=255) — 재시도 $i/7, 20초 후 재접속" >&2
              sleep 20
            done
            return 255
          }

          # 배포 본문($REMOTE)과 "완료 래퍼"를 러너 로컬 파일로 생성(heredoc 없이 — YAML 안전).
          # 래퍼는 setsid 로 분리 실행되어 배포 종료코드를 status 파일에 원자적으로 기록한다.
          LOCAL_SCRIPT="$RUNNER_TEMP/deploy-remote.sh"
          printf '%s' "$REMOTE" > "$LOCAL_SCRIPT"
          LOCAL_WRAP="$RUNNER_TEMP/deploy-wrap.sh"
          {
            echo 'exec >"'"$DIR/$RUNID.log"'" 2>&1'
            echo 'flock "'"$DIR"'/deploy.lock" bash "'"$DIR/$RUNID.sh"'"'
            echo 'ec=$?'
            echo 'echo "$ec" > "'"$DIR/$RUNID.status.tmp"'"'
            echo 'mv "'"$DIR/$RUNID.status.tmp"'" "'"$DIR/$RUNID.status"'"'
            echo 'rm -f "'"$DIR/$RUNID.running"'"'
          } > "$LOCAL_WRAP"

          # 1) 준비 + 배포 스크립트 업로드 (멱등). 산출(stdout): NEW | ALREADY
          echo "::group::Launch detached deploy ($RUNID)"
          GUARD=""; grc=0
          GUARD=$(ssh_do "
            mkdir -p $DIR
            find $DIR -type f -mtime +2 -delete 2>/dev/null || true
            cat > $DIR/$RUNID.sh.tmp
            if [ -f $DIR/$RUNID.status ] || [ -f $DIR/$RUNID.running ]; then
              rm -f $DIR/$RUNID.sh.tmp; echo ALREADY
            else
              mv $DIR/$RUNID.sh.tmp $DIR/$RUNID.sh; echo NEW
            fi
          " "$LOCAL_SCRIPT") || grc=$?
          if [ "$grc" != "0" ]; then
            echo "::endgroup::"
            echo "배포 준비 ssh 실패(rc=$grc) — VPS 도달성 지속 장애. gh run rerun 권장." >&2
            exit "$grc"
          fi
          # 2) 래퍼 업로드 + detached 실행 (NEW 일 때만). .running 을 setsid 前에 기록해
          #    ssh 재시도로 인한 중복 실행을 막는다(flock 도 이중 안전망).
          if printf '%s\n' "$GUARD" | grep -q '^NEW$'; then
            lrc=0
            ssh_do "
              cat > $DIR/$RUNID.wrap.sh
              if [ -f $DIR/$RUNID.running ] || [ -f $DIR/$RUNID.status ]; then
                echo 'already launched (skip)'
              else
                : > $DIR/$RUNID.running
                touch $DIR/deploy.lock
                setsid bash $DIR/$RUNID.wrap.sh </dev/null >/dev/null 2>&1 &
                echo launched
              fi
            " "$LOCAL_WRAP" || lrc=$?
            if [ "$lrc" != "0" ]; then
              echo "::endgroup::"
              echo "detached 실행 시작 실패(rc=$lrc) — gh run rerun 권장." >&2
              exit "$lrc"
            fi
          else
            echo "이미 실행 중인 배포에 재부착 — 폴링으로 이동"
          fi
          echo "::endgroup::"

          # 3) 상태 폴링 (재접속 안전, 최대 25분). status 파일이 나타나면 종료코드 확정.
          echo "::group::Deploy 진행 (10초 폴링 — 마지막 로그줄만 표시)"
          DEADLINE=$(( $(date +%s) + 1500 ))
          LAST=""; STATUS="RUNNING"
          while : ; do
            # ⚠️ 데드라인은 루프 *최상단*에서 검사. rc=255(지속 도달성 장애)로 continue 하는
            #    경로에서도 반드시 25분 안에 빠져나오게 — 아니면 배포 큐(concurrency)를 최대
            #    6시간(GH job timeout)까지 점유(리뷰 CONFIRMED).
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then echo "  ❌ 배포 25분 초과 — 타임아웃(원격은 계속 진행 중일 수 있음)" >&2; STATUS="TIMEOUT"; break; fi
            OUT=""; prc=0
            # STATUS 마커를 *첫 줄*에 emit(echo 라 항상 개행으로 끝남) → 로그 tail 이 개행으로
            #    안 끝나도(빌드 중 부분 줄) 첫 줄 파싱이 STATUS 를 정확히 분리(오파싱→오판 방지).
            OUT=$(ssh_do "
              if [ -f $DIR/$RUNID.status ]; then echo \"__STATUS__ \$(cat $DIR/$RUNID.status)\"; else echo __STATUS__ RUNNING; fi
              tail -n 1 $DIR/$RUNID.log 2>/dev/null || true
            ") || prc=$?
            if [ "$prc" = "255" ]; then echo "  ↻ 폴링 재접속 지속 실패 — 20초 후 재시도" >&2; sleep 20; continue; fi
            if [ "$prc" != "0" ]; then echo "::endgroup::"; echo "폴링 ssh 실패(rc=$prc)" >&2; exit "$prc"; fi
            STATUS="${OUT%%$'\n'*}"; STATUS="${STATUS#__STATUS__ }"
            HB="${OUT#*$'\n'}"
            if [ "$HB" != "$OUT" ] && [ -n "$HB" ] && [ "$HB" != "$LAST" ]; then echo "  · $HB"; LAST="$HB"; fi
            [ "$STATUS" != "RUNNING" ] && break
            sleep 10
          done
          echo "::endgroup::"

          # 4) 전체 로그 덤프(관측) + 정리 + 종료코드 판정
          echo "::group::원격 배포 로그(전체)"
          ssh_do "cat $DIR/$RUNID.log 2>/dev/null || echo '(로그 없음)'" || echo "(로그 회수 실패 — 원격 배포 자체는 완료됐을 수 있음)"
          echo "::endgroup::"
          ssh_do "rm -f $DIR/$RUNID.sh $DIR/$RUNID.wrap.sh $DIR/$RUNID.running" || true

          case "$STATUS" in
            0) echo "✅ 원격 배포 성공(exit 0) — 무중단 컷오버 완료"; exit 0 ;;
            TIMEOUT) echo "❌ 배포 타임아웃 — 원격 상태 미확정. VPS/사이트 점검 필요." >&2; exit 1 ;;
            *) echo "❌ 원격 배포 실패(exit $STATUS) — health 게이트에서 자동 롤백했을 수 있음(위 로그 확인)." >&2; exit 1 ;;
          esac

      - name: Public health check
        run: |
          sleep 5
          curl -sS -o /dev/null -w "https://salesptlog.online → HTTP %{http_code}\n" https://salesptlog.online
