name: Arena Company Folder (audit/fix)

# 아레나 참가자의 `업체관리` 폴더 감사·복구를 VPS 에서 원격 실행.
# arena-season2-batch.yml 과 동일한 SSH·재시도 패턴(값 미출력 원칙 동일).
#
# 왜 VPS 인가: 폴더 생성·이동은 admin OAuth(ADMIN_DRIVE_REFRESH_TOKEN)가 필요한데,
# 이 시크릿은 deploy.yml 이 매 배포마다 VPS .env 에 주입한다(개발 PC 에는 없음).
#
# mode:
#   audit   — 읽기 전용 전수 점검(쓰기 0)
#   plan    — fix dry-run. 무엇을 만들고 무엇을 옮길지만 출력(쓰기 0)
#   execute — 실제 생성 + 이관 + registry 스탬프
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        options: [audit, plan, execute]
        default: audit
      season:
        description: "아레나 시즌 번호 (기본 2)"
        required: false
        default: "2"
      gisu:
        description: "대상 기수 — 쉼표구분 (예: 8,9). 비우면 시즌 전체"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      VPS_TARGET_HOST: ${{ secrets.VPS_HOST_TS || secrets.VPS_HOST }}
      VPS_FALLBACK_HOST: ${{ secrets.VPS_HOST }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      - name: Tailscale (Secrets 미설정 시 스킵)
        if: env.TS_OAUTH_CLIENT_ID != ''
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Validate inputs
        env:
          SEASON: ${{ inputs.season }}
          GISU: ${{ inputs.gisu }}
        run: |
          # 원격 셸에 그대로 들어가는 값이라 형식을 여기서 좁힌다(숫자·쉼표만).
          echo "$SEASON" | grep -Eq '^[0-9]{1,2}$' || { echo "season 은 숫자만" >&2; exit 2; }
          if [ -n "$GISU" ]; then
            echo "$GISU" | grep -Eq '^[0-9]{1,3}(,[0-9]{1,3})*$' || { echo "gisu 는 숫자·쉼표만" >&2; exit 2; }
          fi

      - name: Run arena company folder script on VPS
        env:
          MODE: ${{ inputs.mode }}
          SEASON: ${{ inputs.season }}
          GISU: ${{ inputs.gisu }}
        run: |
          REMOTE=$(cat <<'REMOTE_EOF'
          set -e
          cd /opt/salespt-log
          FLAGS="--season $SEASON_ARG"
          if [ -n "$GISU_ARG" ]; then FLAGS="$FLAGS --gisu $GISU_ARG"; fi
          case "$MODE_ARG" in
            audit)   FLAGS="--audit $FLAGS" ;;
            plan)    FLAGS="--fix $FLAGS" ;;
            execute) FLAGS="--fix --execute $FLAGS" ;;
            *) echo "알 수 없는 mode: $MODE_ARG" >&2; exit 2 ;;
          esac
          node scripts/ops/arena-company-folder.mjs $FLAGS
          REMOTE_EOF
          )
          # rc=255(도달성) 한정 재시도 — 다른 VPS 워크플로와 동일 패턴.
          set +e
          HOSTS=("$VPS_TARGET_HOST")
          if [ "$VPS_FALLBACK_HOST" != "$VPS_TARGET_HOST" ]; then HOSTS+=("$VPS_FALLBACK_HOST"); fi
          NHOSTS=${#HOSTS[@]}
          for i in $(seq 1 7); do
            HOST="${HOSTS[$(( (i - 1) % NHOSTS ))]}"
            if [[ "$HOST" == *:* ]]; then FAM=-6; TARGET="root@[$HOST]"; else FAM=-4; TARGET="root@$HOST"; fi
            ssh $FAM -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
                -i ~/.ssh/id_ed25519 "$TARGET" \
                "MODE_ARG=\"$MODE\" SEASON_ARG=\"$SEASON\" GISU_ARG=\"$GISU\" bash -s" <<<"$REMOTE"
            rc=$?
            if [ "$rc" = "0" ]; then exit 0; fi
            if [ "$rc" = "255" ]; then
              echo "ssh 연결 실패(rc=255, host=$HOST) — 시도 $i/7, 25초 후 재시도" >&2
              sleep 25
            else
              echo "스크립트 실패(rc=$rc) — 재시도 안 함(멱등 재실행으로 수렴)" >&2
              exit "$rc"
            fi
          done
          echo "ssh 7회 모두 실패 — VPS 도달성 지속 장애" >&2
          exit 1
