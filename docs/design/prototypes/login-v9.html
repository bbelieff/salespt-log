<!DOCTYPE html>
<html lang="ko">
<!-- Design: 로그인 인트로 v9 (로고 중심 + Premium 인터랙션) — 2026-05-10
     사용자 피드백:
     - v8 마음에 안 들었음
     - 로고 중점, 멋있는 인트로 배경 + 인터랙션
     - 흐름: Google 로그인 → 기수 + 이름 입력만 → 끝

     매칭: Drive API 파일명 검색
     - 트레이너: 시트 이름 "세일즈PT_ N기 이름 수강생 경영일지"
     - 사용자: 기수 + 이름 입력 → 서버가 Drive 검색 → 시트 매칭

     v9 디자인:
     - 큰 로고 중심 (브랜드 그 자체)
     - Aurora gradient 배경 (천천히 흐름)
     - 마우스 따라가는 그라디언트 spotlight
     - 로고 호흡 + 클릭 시 펄스 ripple (빨강·검정 톤)
     - 매트한 미니멀 (3dicons 톤 유지)
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>경영일지</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Roboto:wght@500&display=swap');
  * { font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  body { margin: 0; padding: 0; overflow: hidden; background: #fafafa; color: #0a0a0a; }

  :root {
    --red: #d71617;
    --red-light: #ff6b6b;
    --red-deep: #a30f10;
    --ink: #0a0a0a;
  }

  /* ═════════════════════════════════════════════
     배경: Aurora + Spotlight (premium animated)
     ═════════════════════════════════════════════ */
  .aurora-bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 20%, rgba(215,22,23,0.10) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 80% 30%, rgba(255,107,107,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 50% 100%, rgba(0,0,0,0.04) 0%, transparent 60%),
      linear-gradient(180deg, #fafafa 0%, #f5f5f5 100%);
    animation: auroraShift 14s ease-in-out infinite alternate;
  }
  @keyframes auroraShift {
    0%   { transform: scale(1) rotate(0deg);   filter: hue-rotate(0deg); }
    100% { transform: scale(1.1) rotate(2deg); filter: hue-rotate(-8deg); }
  }

  /* Mouse-following spotlight */
  .spotlight {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(
      circle 320px at var(--mx, 50%) var(--my, 50%),
      rgba(215,22,23,0.10) 0%,
      rgba(215,22,23,0.04) 30%,
      transparent 70%
    );
    transition: background 0.2s ease-out;
  }

  /* Grain (premium 톤) */
  .grain {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    opacity: 0.04;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ═════════════════════════════════════════════
     Splash: 로고 시퀀스
     ═════════════════════════════════════════════ */
  .splash {
    position: fixed; inset: 0; z-index: 95;
    background: white;
    display: flex; align-items: center; justify-content: center;
    animation: splashOut 0.8s cubic-bezier(.4,0,.2,1) 1.6s forwards;
  }
  @keyframes splashOut { to { opacity: 0; visibility: hidden; transform: scale(1.04); } }
  .splash img {
    width: 240px; height: auto;
    animation: splashIn 1.4s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes splashIn {
    0%   { opacity: 0; transform: scale(0.7); filter: blur(20px); }
    50%  { opacity: 1; filter: blur(0); }
    70%  { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  /* ═════════════════════════════════════════════
     Stage
     ═════════════════════════════════════════════ */
  .stage {
    position: relative; z-index: 10;
    min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: 0 32px 32px;
    opacity: 0;
    animation: stageIn 0.9s cubic-bezier(.2,.8,.2,1) 1.9s forwards;
  }
  @keyframes stageIn { 0%{opacity:0;transform:translateY(12px)} 100%{opacity:1;} }

  /* ═════════════════════════════════════════════
     로고 영역 (Hero) — 인터랙티브
     ═════════════════════════════════════════════ */
  .logo-stage {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    padding: 48px 0;
  }

  /* 로고 뒤 스포트라이트 (호흡) */
  .logo-aura {
    position: absolute;
    width: 420px; height: 420px;
    border-radius: 50%;
    background: radial-gradient(
      circle at center,
      rgba(215,22,23,0.18) 0%,
      rgba(215,22,23,0.08) 30%,
      transparent 70%
    );
    filter: blur(20px);
    animation: auraPulse 4s ease-in-out infinite;
  }
  @keyframes auraPulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50%      { transform: scale(1.15); opacity: 1; }
  }

  /* 회전 ring 4개 */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid;
    pointer-events: none;
    transform-origin: center;
  }
  .ring.r1 { width: 280px; height: 280px; border-color: rgba(215,22,23,0.18); border-top-color: rgba(215,22,23,0.7); animation: ringRot 8s linear infinite; }
  .ring.r2 { width: 340px; height: 340px; border-color: rgba(0,0,0,0.06); border-right-color: rgba(0,0,0,0.5); animation: ringRot 14s linear infinite reverse; }
  .ring.r3 { width: 400px; height: 400px; border-color: rgba(215,22,23,0.08); border-bottom-color: rgba(215,22,23,0.4); border-style: dashed; animation: ringRot 24s linear infinite; }
  @keyframes ringRot { to { transform: rotate(360deg); } }

  /* Floating dots (3 개, 저주파 떠다님) */
  .float-dot {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: dotFloat ease-in-out infinite;
  }
  .float-dot.d1 { width: 8px; height: 8px; background: var(--red); top: 12%; left: 18%; box-shadow: 0 0 12px var(--red); animation-duration: 5s; }
  .float-dot.d2 { width: 6px; height: 6px; background: var(--ink); bottom: 18%; right: 22%; box-shadow: 0 0 8px var(--ink); animation-duration: 7s; animation-delay: 1s; }
  .float-dot.d3 { width: 10px; height: 10px; background: var(--red-light); top: 28%; right: 14%; box-shadow: 0 0 14px var(--red-light); animation-duration: 6s; animation-delay: 2.5s; opacity: 0.6; }
  @keyframes dotFloat {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(8px, -16px); }
  }

  /* 로고 자체 — 호흡 + 클릭 펄스 */
  .logo-hero {
    position: relative;
    z-index: 5;
    width: 100%; max-width: 280px;
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(.2,.8,.2,1);
    filter: drop-shadow(0 12px 32px rgba(215,22,23,0.10))
            drop-shadow(0 4px 12px rgba(0,0,0,0.05));
    animation: logoBreathe 5s ease-in-out infinite;
  }
  @keyframes logoBreathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-6px) scale(1.02); }
  }
  .logo-hero:hover { transform: scale(1.03) translateY(-4px); }
  .logo-hero.pulse { animation: logoPulse 0.6s cubic-bezier(.2,.8,.2,1); }
  @keyframes logoPulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.12); filter: drop-shadow(0 16px 40px rgba(215,22,23,0.4)); }
    100% { transform: scale(1); }
  }

  /* 클릭 시 ripple 발생 */
  .ripple-burst {
    position: absolute; left: 50%; top: 50%;
    width: 0; height: 0; border-radius: 50%;
    border: 3px solid var(--red);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 4;
    animation: rippleOut 1.2s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes rippleOut {
    0%   { width: 0; height: 0; opacity: 1; border-width: 3px; }
    100% { width: 600px; height: 600px; opacity: 0; border-width: 0; }
  }

  /* ═════════════════════════════════════════════
     Welcome 카피
     ═════════════════════════════════════════════ */
  .welcome {
    text-align: center;
    padding: 0 0 24px;
  }
  .welcome h1 {
    font-size: 22px; font-weight: 700;
    letter-spacing: -0.025em;
    color: var(--ink);
    line-height: 1.4;
  }
  .welcome p {
    font-size: 13px; color: #737373;
    margin-top: 6px;
  }

  /* ═════════════════════════════════════════════
     Google 공식 sign-in 버튼
     ═════════════════════════════════════════════ */
  .gsi-button {
    width: 100%;
    height: 52px;
    background: white;
    color: #1f1f1f;
    border: 1px solid #d4d4d4;
    border-radius: 26px;
    font-family: 'Roboto', 'Noto Sans KR', sans-serif;
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.01em;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .gsi-button:hover {
    background: #f8f9fa; border-color: #a3a3a3;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    transform: translateY(-2px);
  }
  .gsi-button:active { background: #f5f5f5; transform: translateY(0) scale(0.99); }

  /* ═════════════════════════════════════════════
     Claim form
     ═════════════════════════════════════════════ */
  .field {
    width: 100%;
    height: 52px;
    background: white;
    border: 1.5px solid #e5e5e5;
    border-radius: 14px;
    padding: 0 16px;
    font-size: 15px; font-weight: 600;
    color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance: none; appearance: none;
  }
  .field:focus {
    outline: none; border-color: var(--red);
    box-shadow: 0 0 0 4px rgba(215,22,23,0.10);
  }
  .field::placeholder { color: #a3a3a3; font-weight: 500; }

  .field-label {
    display: block;
    font-size: 11px; font-weight: 800;
    color: #737373;
    letter-spacing: 0.06em; text-transform: uppercase;
    margin-bottom: 6px;
  }

  /* CTA */
  .btn-claim {
    width: 100%;
    height: 56px;
    background: var(--ink);
    color: white;
    border-radius: 28px;
    font-size: 15px; font-weight: 700;
    letter-spacing: -0.01em;
    display: inline-flex;
    align-items: center; justify-content: center; gap: 8px;
    transition: all 0.2s; cursor: pointer; border: 0;
  }
  .btn-claim:hover {
    background: #1a1a1a;
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(0,0,0,0.18);
  }
  .btn-claim:active { transform: translateY(0) scale(0.99); }
  .btn-claim:disabled { background: #d4d4d4; cursor: not-allowed; transform: none; box-shadow: none; }

  /* Footer */
  .foot {
    text-align: center;
    padding: 16px 0 8px;
    color: #a3a3a3;
    font-size: 11px;
  }
  .foot .dot { color: #d4d4d4; margin: 0 6px; }

  /* States */
  [data-state] { display: none; }
  [data-state].active { display: flex; }

  .state-nav {
    position: fixed; top: 8px; right: 8px; z-index: 100;
    background: rgba(0,0,0,.85); color: white; border-radius: 10px;
    padding: 6px 8px; font-size: 11px; display: flex; gap: 6px;
  }
  .state-nav button {
    background: rgba(255,255,255,.1); padding: 4px 10px; border-radius: 6px;
    color: white; font-weight: 700;
  }
  .state-nav button.active { background: var(--red); }
</style>
</head>
<body>

<!-- 배경 layers -->
<div class="aurora-bg"></div>
<div class="spotlight" id="spotlight"></div>
<div class="grain"></div>

<!-- Splash -->
<div class="splash">
  <img src="../../../public/salespt-logo.png" alt="세일즈PT">
</div>

<!-- State nav -->
<nav class="state-nav">
  <button onclick="location.reload()" style="background:rgba(255,255,255,.2);">↻</button>
  <button data-go="login" class="active">1) 로그인</button>
  <button data-go="claim">2) 정보 입력</button>
</nav>

<!-- ═══════════════════════════════════════════════════════════
     STATE 1: 로그인 (로고 + 인터랙션 + Google)
     ═══════════════════════════════════════════════════════════ -->
<main data-state="login" class="active stage">

  <!-- Logo Hero -->
  <div class="logo-stage" id="logoStage">
    <div class="logo-aura"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="float-dot d1"></div>
    <div class="float-dot d2"></div>
    <div class="float-dot d3"></div>
    <img src="../../../public/salespt-logo.png" alt="세일즈PT" class="logo-hero" id="logoHero">
  </div>

  <!-- Welcome -->
  <div class="welcome">
    <h1>세일즈피티 경영일지에<br>오신 걸 환영합니다</h1>
  </div>

  <!-- Google sign-in -->
  <button class="gsi-button" type="button" id="btnGoogle">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    <span>Google 계정으로 로그인</span>
  </button>

  <div class="foot">
    <span>세일즈피티 수강생 전용</span>
    <span class="dot">·</span>
    <span>v1.0</span>
  </div>
</main>

<!-- ═══════════════════════════════════════════════════════════
     STATE 2: 정보 입력 (기수 + 이름)
     ═══════════════════════════════════════════════════════════ -->
<main data-state="claim" class="stage" style="display:none;">

  <!-- 작은 로고 -->
  <div class="text-center pt-12 pb-8">
    <img src="../../../public/salespt-logo.png" alt="세일즈PT" style="height: 36px; width: auto; margin: 0 auto;">
  </div>

  <!-- Welcome -->
  <div class="welcome" style="padding-bottom: 32px;">
    <h1>거의 다 왔습니다</h1>
    <p>기수와 본인 이름을 입력해 주세요.</p>
  </div>

  <!-- Form -->
  <div class="space-y-5 max-w-sm mx-auto w-full">
    <div>
      <label class="field-label">기수</label>
      <input class="field" id="cohortField" type="number" inputmode="numeric" placeholder="예: 7" autocomplete="off" min="1" max="99">
    </div>
    <div>
      <label class="field-label">본인 이름</label>
      <input class="field" id="nameField" type="text" placeholder="예: 김상목" autocomplete="off">
    </div>
    <p class="text-[11px] text-gray-400 leading-relaxed pt-1">
      트레이너가 만든 본인 시트와 자동으로 연결됩니다.<br>
      (시트 이름: <code class="text-gray-600 bg-gray-100 px-1 rounded text-[10px]">세일즈PT_ 기수 이름 수강생 경영일지</code>)
    </p>
  </div>

  <div class="flex-1 min-h-[20px]"></div>

  <button class="btn-claim mb-2" id="btnSubmitClaim" disabled>
    <span>경영일지 시작하기</span>
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M1 7H13M13 7L7 1M13 7L7 13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <button class="w-full text-xs text-gray-400 hover:text-gray-600 underline-offset-2 hover:underline py-2">
    다른 Google 계정으로 로그인
  </button>
</main>

<script>
  const haptic = (ms = 8) => navigator.vibrate?.(ms);

  // ── Mouse spotlight ──────────────────────────────────
  const spot = document.getElementById('spotlight');
  document.addEventListener('mousemove', (e) => {
    spot.style.setProperty('--mx', e.clientX + 'px');
    spot.style.setProperty('--my', e.clientY + 'px');
  });
  document.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    spot.style.setProperty('--mx', t.clientX + 'px');
    spot.style.setProperty('--my', t.clientY + 'px');
  }, { passive: true });

  // ── Logo click — pulse + ripple ──────────────────────
  const logoStage = document.getElementById('logoStage');
  const logoHero = document.getElementById('logoHero');
  if (logoHero) {
    logoHero.addEventListener('click', (e) => {
      e.stopPropagation();
      logoHero.classList.remove('pulse');
      void logoHero.offsetWidth;
      logoHero.classList.add('pulse');
      // Ripple burst
      const rip = document.createElement('div');
      rip.className = 'ripple-burst';
      logoStage.appendChild(rip);
      setTimeout(() => rip.remove(), 1200);
      haptic(12);
    });
  }

  // ── State toggle ─────────────────────────────────────
  function switchState(target) {
    document.querySelectorAll('[data-state]').forEach((s) => {
      const isActive = s.dataset.state === target;
      s.classList.toggle('active', isActive);
      s.style.display = isActive ? 'flex' : 'none';
    });
    document.querySelectorAll('.state-nav button[data-go]').forEach((b) => {
      b.classList.toggle('active', b.dataset.go === target);
    });
  }
  document.querySelectorAll('.state-nav button[data-go]').forEach((btn) => {
    btn.addEventListener('click', () => switchState(btn.dataset.go));
  });

  // Google 로그인 → claim 화면 (실 구현 시 NextAuth signIn → /claim redirect)
  document.getElementById('btnGoogle').addEventListener('click', () => {
    haptic(10);
    setTimeout(() => switchState('claim'), 200);
  });

  // ── Claim form: 활성화 ───────────────────────────────
  const cohortF = document.getElementById('cohortField');
  const nameF = document.getElementById('nameField');
  const btnSubmit = document.getElementById('btnSubmitClaim');

  function validateForm() {
    const c = (cohortF.value || '').trim();
    const n = (nameF.value || '').trim();
    btnSubmit.disabled = !(c && /^\d+$/.test(c) && n.length >= 2);
  }
  cohortF.addEventListener('input', validateForm);
  nameF.addEventListener('input', validateForm);

  btnSubmit.addEventListener('click', () => {
    haptic(15);
    // 실 구현: POST /api/claim { cohort, name } → Drive 검색 → 시트 매칭 → /dashboard
    const c = cohortF.value;
    const n = nameF.value;
    alert(`매칭 시도: 세일즈PT_ ${c}기 ${n} 수강생 경영일지`);
  });
</script>
</body>
</html>
