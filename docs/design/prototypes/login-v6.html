<!DOCTYPE html>
<html lang="ko">
<!-- Design: 로그인 인트로 v6 (로고 중앙 + 돈 떨어짐) — 2026-05-09
     변경:
     - 로고 화면 정중앙 고정
     - $ 지폐 + 골드 코인이 위에서 떨어지는 애니메이션
     - 컬러 시스템: 빨강 #d71617 + 검정 + 흰 + GOLD #f59e0b (3rd 추가)
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>경영일지 — v6 (Money Rain)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap');
  * { font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  body { margin: 0; padding: 0; overflow: hidden; background: #ffffff; color: #0a0a0a; }

  :root {
    --red: #d71617;
    --red-soft: #ff6b6b;
    --gold: #f59e0b;
    --gold-soft: #fbbf24;
    --gold-deep: #b45309;
    --ink: #0a0a0a;
  }
  .text-red { color: var(--red); }
  .text-gold { color: var(--gold); }
  .bg-red { background-color: var(--red); }
  .bg-gold { background-color: var(--gold); }

  /* ═════ Money rain (떨어지는 돈) ═════ */
  .rain-layer {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .money {
    position: absolute;
    top: -80px;
    will-change: transform;
    animation: fall linear infinite, sway ease-in-out infinite alternate;
  }
  @keyframes fall {
    0%   { transform: translateY(-10vh) rotate(0deg); }
    100% { transform: translateY(120vh) rotate(360deg); }
  }
  @keyframes sway {
    0%   { margin-left: -20px; }
    100% { margin-left: 20px; }
  }

  /* $ 지폐 */
  .bill {
    width: 56px; height: 28px;
    background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fcd34d 100%);
    border: 1.5px solid var(--gold);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Arial Black', sans-serif;
    font-size: 18px; font-weight: 900;
    color: var(--gold-deep);
    box-shadow: 0 2px 8px rgba(245,158,11,0.3),
                inset 0 0 0 1.5px rgba(255,255,255,0.4);
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
  }

  /* 골드 코인 */
  .coin {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fde68a 0%, var(--gold-soft) 30%, var(--gold) 65%, var(--gold-deep) 100%);
    border: 1.5px solid var(--gold-deep);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Arial Black', sans-serif;
    font-size: 14px; font-weight: 900;
    color: var(--gold-deep);
    box-shadow: 0 3px 8px rgba(180,83,9,0.4),
                inset -3px -3px 6px rgba(180,83,9,0.3),
                inset 2px 2px 4px rgba(255,255,255,0.3);
  }

  /* 빨강 지폐 (브랜드) */
  .bill-red {
    width: 60px; height: 30px;
    background: linear-gradient(135deg, #fee2e2 0%, #fca5a5 50%, var(--red-soft) 100%);
    border: 1.5px solid var(--red);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Arial Black', sans-serif;
    font-size: 18px; font-weight: 900;
    color: var(--red);
    box-shadow: 0 2px 8px rgba(215,22,23,0.25),
                inset 0 0 0 1.5px rgba(255,255,255,0.4);
  }

  /* ═════ Stage (로고 중앙) ═════ */
  .stage {
    position: relative;
    z-index: 10;
    min-height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 40px 24px 32px;
  }

  /* Logo 중앙 anchor */
  .logo-center {
    position: relative;
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    width: 100%;
  }
  .logo-glow {
    position: absolute;
    width: 380px; height: 380px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(215,22,23,0.12) 0%, rgba(245,158,11,0.06) 40%, transparent 70%);
    filter: blur(20px);
    animation: glowPulse 3.5s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50%      { transform: scale(1.1); opacity: 1; }
  }
  .logo-center img {
    position: relative;
    width: 80%; max-width: 320px; height: auto;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.12));
    animation: logoBreathe 4s ease-in-out infinite;
    cursor: pointer;
  }
  @keyframes logoBreathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.03); }
  }

  /* Coin pile at bottom (배경) */
  .coin-pile {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 0;
    background: linear-gradient(0deg, var(--gold-deep) 0%, var(--gold) 50%, var(--gold-soft) 100%);
    border-top: 2px solid var(--gold-deep);
    z-index: 2;
    transition: height 0.5s ease-out;
    box-shadow: 0 -4px 20px rgba(245,158,11,0.3);
    pointer-events: none;
  }

  /* Caption */
  .caption {
    text-align: center;
    margin-top: 24px;
  }
  .caption h1 {
    font-size: 32px;
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: -0.04em;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .caption p {
    font-size: 14px;
    color: #6b7280;
    line-height: 1.5;
  }

  /* CTA */
  .btn-primary {
    width: 100%;
    height: 60px;
    background: linear-gradient(135deg, var(--red) 0%, #b91212 100%);
    color: white;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.02em;
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    box-shadow: 0 8px 24px rgba(215,22,23,0.4),
                inset 0 1px 0 rgba(255,255,255,0.2);
    border-top: 1.5px solid rgba(255,255,255,0.15);
    transition: transform 0.18s, box-shadow 0.18s;
    position: relative; overflow: hidden;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(215,22,23,0.55), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .btn-primary:active { transform: translateY(0) scale(0.98); }
  .btn-primary::before {
    content: ''; position: absolute; top: var(--ry, 50%); left: var(--rx, 50%);
    width: 0; height: 0; background: rgba(255,255,255,0.5);
    border-radius: 50%; transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .btn-primary.ripple::before { animation: ripple 0.6s ease-out; }
  @keyframes ripple {
    0%   { width: 0; height: 0; opacity: 1; }
    100% { width: 600px; height: 600px; opacity: 0; }
  }

  /* Gold accent badge */
  .gold-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    background: linear-gradient(135deg, var(--gold-soft) 0%, var(--gold) 100%);
    color: var(--gold-deep);
    border-radius: 999px;
    font-size: 11px; font-weight: 800;
    letter-spacing: 0.05em;
    box-shadow: 0 2px 8px rgba(245,158,11,0.3);
    border: 1px solid var(--gold);
  }

  /* Splash */
  .splash {
    position: fixed; inset: 0; z-index: 95;
    background: white;
    display: flex; align-items: center; justify-content: center;
    animation: splashOut 0.7s ease-in 1.5s forwards;
  }
  @keyframes splashOut { to { opacity: 0; visibility: hidden; } }
  .splash img {
    width: 240px; height: auto;
    animation: splashIn 1.4s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes splashIn {
    0%   { opacity: 0; transform: scale(0.7); filter: blur(20px); }
    50%  { opacity: 1; transform: scale(1.05); filter: blur(0); }
    100% { transform: scale(1); }
  }

  /* Confetti */
  .confetti {
    position: fixed; pointer-events: none; z-index: 80;
    width: 8px; height: 14px;
    animation: confettiFall 2.5s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* States */
  [data-state] { display: none; }
  [data-state].active { display: flex; }

  .state-nav {
    position: fixed; top: 8px; right: 8px; z-index: 100;
    background: rgba(0,0,0,.85); color: white; border-radius: 10px;
    padding: 6px 8px; font-size: 11px; display: flex; gap: 6px;
  }
  .state-nav button {
    background: rgba(255,255,255,.1); padding: 4px 10px; border-radius: 6px;
    color: white; font-weight: 700;
  }
  .state-nav button.active { background: var(--red); }

  /* Cohort pill */
  .cohort-pill {
    position: relative;
    display: inline-flex; gap: 4px;
    background: #f3f4f6; border-radius: 14px; padding: 4px;
    width: 100%;
  }
  .cohort-indicator {
    position: absolute; top: 4px; bottom: 4px;
    background: linear-gradient(135deg, var(--red), #b91212);
    border-radius: 10px;
    box-shadow: 0 4px 12px rgba(215,22,23,0.3);
    transition: transform 0.4s cubic-bezier(.4,1.4,.4,1), width 0.4s cubic-bezier(.4,1.4,.4,1);
    z-index: 0;
  }
  .cohort-pill button {
    flex: 1; position: relative; z-index: 1;
    padding: 12px 0; font-size: 13px; font-weight: 700; color: #6b7280;
    transition: color 0.25s;
    background: transparent; border: 0;
  }
  .cohort-pill button.active { color: white !important; }

  .name-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .name-chip {
    padding: 14px 12px; border-radius: 12px;
    background: white; border: 2px solid #e5e7eb;
    font-size: 14px; font-weight: 700; color: var(--ink);
    transition: all 0.2s;
    text-align: center; cursor: pointer;
  }
  .name-chip:hover { border-color: var(--red); transform: translateY(-2px); }
  .name-chip.selected {
    background: var(--red); border-color: var(--red); color: white;
    box-shadow: 0 6px 20px rgba(215,22,23,0.3);
    transform: translateY(-2px);
  }
  /* Selected chip gets gold corner accent */
  .name-chip.selected::after {
    content: '$'; position: absolute; top: 4px; right: 8px;
    font-family: 'Arial Black', sans-serif;
    color: var(--gold-soft); font-size: 14px; font-weight: 900;
  }
  .name-chip { position: relative; }
</style>
</head>
<body>

<!-- Splash -->
<div class="splash">
  <img src="../../../public/salespt-logo.png" alt="세일즈PT">
</div>

<!-- State nav -->
<nav class="state-nav">
  <button onclick="location.reload()" style="background:rgba(255,255,255,.2);">↻</button>
  <button data-go="onboard" class="active">1) 인트로</button>
  <button data-go="claim">2) Claim</button>
</nav>

<!-- Money rain layer (모든 state 공통 배경) -->
<div class="rain-layer" id="rainLayer"></div>
<div class="coin-pile" id="coinPile"></div>

<!-- ═══════════════════════════════════════════════════════════
     STATE 1: Onboard (로고 중앙 + 돈 떨어짐)
     ═══════════════════════════════════════════════════════════ -->
<main data-state="onboard" class="active stage">

  <!-- 상단 빈 공간 (돈 떨어지는 영역) -->
  <div></div>

  <!-- 중앙: 로고 -->
  <div class="logo-center">
    <div class="logo-glow"></div>
    <img src="../../../public/salespt-logo.png" alt="세일즈PT" id="centerLogo">
  </div>

  <!-- 하단: 카피 + CTA -->
  <div class="w-full max-w-sm">
    <div class="caption mb-6">
      <span class="gold-badge mb-3">
        <svg width="10" height="10" viewBox="0 0 12 12" fill="currentColor">
          <circle cx="6" cy="6" r="5"/>
        </svg>
        7TH BATCH · 2026
      </span>
      <h1>매일의 <span class="text-red">$</span> 가<br>쌓이는 곳</h1>
      <p>세일즈피티 7기 경영일지에<br>오신 걸 환영합니다.</p>
    </div>

    <button class="btn-primary" id="btnStart">
      <span>Google 계정으로 시작하기</span>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M1 7H13M13 7L7 1M13 7L7 13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <p class="text-[11px] text-gray-400 text-center mt-4 leading-relaxed">
      트레이너에게 받은 링크로 접속하셨나요?
    </p>
  </div>
</main>

<!-- ═══════════════════════════════════════════════════════════
     STATE 2: Claim
     ═══════════════════════════════════════════════════════════ -->
<main data-state="claim" class="bg-white" style="display:none; flex-direction:column; min-height:100dvh; position:relative; z-index:10;">
  <div class="flex-1 flex flex-col px-6 pt-10 pb-8">

    <!-- 작은 로고 -->
    <div class="text-center mb-6">
      <img src="../../../public/salespt-logo.png" alt="세일즈PT"
           style="height: 36px; width: auto; margin: 0 auto;">
    </div>

    <!-- 헤더 -->
    <div class="text-center mb-7">
      <span class="gold-badge mb-3">처음 접속</span>
      <h1 class="text-3xl font-black mb-2 tracking-tight" style="color:#0a0a0a;">
        반가워요 <span class="text-red">$</span>
      </h1>
      <p class="text-sm text-gray-500">기수와 본인 이름을 알려주세요.</p>
    </div>

    <!-- 로그인된 이메일 -->
    <div class="mb-7 flex items-center gap-2 rounded-xl bg-blue-50 px-3 py-3 text-xs text-blue-800 border border-blue-100">
      <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
      </svg>
      <span class="font-medium truncate">belief@gmail.com 으로 로그인됨</span>
    </div>

    <label class="block text-xs font-black text-gray-700 mb-2 uppercase tracking-widest">기수</label>
    <div class="cohort-pill mb-7" id="cohortPill">
      <span class="cohort-indicator" id="cohortIndicator"></span>
      <button>5기</button>
      <button>6기</button>
      <button class="active">7기</button>
      <button>8기</button>
    </div>

    <label class="block text-xs font-black text-gray-700 mb-2 uppercase tracking-widest">본인 선택</label>
    <div class="name-grid mb-2">
      <button class="name-chip">김OO</button>
      <button class="name-chip selected">박OO</button>
      <button class="name-chip">이OO</button>
      <button class="name-chip">최OO</button>
      <button class="name-chip">정OO</button>
      <button class="name-chip">강OO</button>
      <button class="name-chip">조OO</button>
      <button class="name-chip">윤OO</button>
    </div>
    <p class="mt-3 text-[11px] text-gray-400 leading-relaxed">
      목록에 본인 이름이 없다면 트레이너에게 문의해 주세요.
    </p>

    <div class="flex-1 min-h-[20px]"></div>

    <button class="btn-primary mb-3">
      <span>경영일지 시작</span>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M1 7H13M13 7L7 1M13 7L7 13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</main>

<script>
  const haptic = (ms = 10) => navigator.vibrate?.(ms);

  // ── Money rain ───────────────────────────────────────
  const rainLayer = document.getElementById('rainLayer');
  const coinPile = document.getElementById('coinPile');
  let coinCount = 0;

  function spawnMoney() {
    const types = ['bill', 'bill', 'coin', 'coin', 'coin', 'bill-red'];
    const type = types[Math.floor(Math.random() * types.length)];
    const el = document.createElement('div');
    el.className = `money ${type}`;
    el.textContent = '$';
    el.style.left = (Math.random() * 100) + '%';
    el.style.animationDuration = `${4 + Math.random() * 4}s, ${1 + Math.random() * 2}s`;
    el.style.animationDelay = `${Math.random() * 0.4}s`;
    el.style.opacity = String(0.7 + Math.random() * 0.3);
    rainLayer.appendChild(el);
    setTimeout(() => {
      el.remove();
      // 코인 누적 파일 천천히 차오름
      coinCount++;
      if (coinCount % 20 === 0) {
        const h = Math.min(60, parseInt(coinPile.style.height || '0') + 4);
        coinPile.style.height = h + 'px';
      }
    }, 9000);
  }

  // 초기 셋업: 8개 빠르게, 그 후 1개/0.4s
  for (let i = 0; i < 8; i++) setTimeout(spawnMoney, i * 200);
  setInterval(spawnMoney, 400);

  // ── Logo click — money burst ─────────────────────────
  document.getElementById('centerLogo').addEventListener('click', () => {
    haptic(15);
    // 빨강·골드 confetti burst
    burstMoney(40);
  });

  function burstMoney(count = 40) {
    const colors = ['#d71617', '#f59e0b', '#fbbf24', '#0a0a0a'];
    for (let i = 0; i < count; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (50 + (Math.random() - 0.5) * 60) + '%';
      c.style.top = '50%';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.width = (6 + Math.random() * 6) + 'px';
      c.style.height = (10 + Math.random() * 8) + 'px';
      c.style.animationDuration = (1.6 + Math.random() * 1.2) + 's';
      c.style.transform = `rotate(${Math.random() * 360}deg)`;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3500);
    }
  }

  // ── Ripple ───────────────────────────────────────────
  function rippleAt(el, ev) {
    const r = el.getBoundingClientRect();
    const x = (ev.clientX || (ev.touches?.[0]?.clientX) || r.width/2) - r.left;
    const y = (ev.clientY || (ev.touches?.[0]?.clientY) || r.height/2) - r.top;
    el.style.setProperty('--rx', x + 'px');
    el.style.setProperty('--ry', y + 'px');
    el.classList.remove('ripple'); void el.offsetWidth;
    el.classList.add('ripple');
    setTimeout(() => el.classList.remove('ripple'), 600);
  }

  // ── Magnetic CTA ─────────────────────────────────────
  document.querySelectorAll('.btn-primary').forEach((btn) => {
    btn.addEventListener('mousemove', (e) => {
      const r = btn.getBoundingClientRect();
      const x = (e.clientX - r.left - r.width / 2) / r.width;
      const y = (e.clientY - r.top - r.height / 2) / r.height;
      btn.style.transform = `translate(${x * 6}px, ${y * 4 - 2}px)`;
    });
    btn.addEventListener('mouseleave', () => { btn.style.transform = ''; });
    btn.addEventListener('click', (e) => {
      rippleAt(btn, e);
      haptic(12);
      burstMoney(20);
    });
  });

  // ── Cohort indicator ─────────────────────────────────
  function moveCohortIndicator() {
    const pill = document.getElementById('cohortPill');
    const ind = document.getElementById('cohortIndicator');
    const active = pill?.querySelector('button.active');
    if (!pill || !ind || !active) return;
    const pr = pill.getBoundingClientRect();
    const ar = active.getBoundingClientRect();
    ind.style.transform = `translateX(${ar.left - pr.left - 4}px)`;
    ind.style.width = ar.width + 'px';
  }
  document.querySelectorAll('.cohort-pill button').forEach((b) => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.cohort-pill button').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      moveCohortIndicator();
      haptic(8);
    });
  });

  // ── Name chip select ─────────────────────────────────
  document.querySelectorAll('.name-chip').forEach((c) => {
    c.addEventListener('click', () => {
      document.querySelectorAll('.name-chip').forEach((x) => x.classList.remove('selected'));
      c.classList.add('selected');
      haptic(8);
    });
  });

  // ── State toggle ─────────────────────────────────────
  function switchState(target) {
    document.querySelectorAll('[data-state]').forEach((s) => {
      const isActive = s.dataset.state === target;
      s.classList.toggle('active', isActive);
      s.style.display = isActive ? 'flex' : 'none';
    });
    document.querySelectorAll('.state-nav button[data-go]').forEach((b) => {
      b.classList.toggle('active', b.dataset.go === target);
    });
    if (target === 'claim') requestAnimationFrame(moveCohortIndicator);
  }
  document.querySelectorAll('.state-nav button[data-go]').forEach((btn) => {
    btn.addEventListener('click', () => switchState(btn.dataset.go));
  });

  // ── Boot ─────────────────────────────────────────────
  setTimeout(() => moveCohortIndicator(), 100);
  window.addEventListener('resize', moveCohortIndicator);
</script>
</body>
</html>
