<!DOCTYPE html>
<html lang="ko">
<!-- Design: 로그인 인트로 v3 (Cosmic / Space) — 2026-05-09
     컨셉:
     - 깊은 보라/블랙 우주 배경 + 별빛
     - 회전하는 행성 (브랜드 빨강 = 사업 = 별)
     - 4지표 별자리 (constellation lines connecting 4 metric stars)
     - 혜성 스트릭 (탄생·성장 메타포)
     - Aurora glow (상하 반응형 색채)
     - 깊이감 있는 parallax (CSS 3D transform)

     v1 (login.html)    = Bright mesh
     v2 (login-v2.html) = Dark cinematic
     v3 (login-v3.html) = Cosmic / 우주
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>경영일지 — Cosmic</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Orbitron:wght@500;700;900&display=swap');
  * { font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  body { margin: 0; padding: 0; overflow: hidden; background: #02010a; color: #fff; }

  .brand-red { color: #ff5757; }

  /* ═════ Deep space gradient ═════ */
  .space-bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 0%, #4a1a8a 0%, transparent 40%),
      radial-gradient(ellipse at 80% 30%, #6a1a4a 0%, transparent 35%),
      radial-gradient(ellipse at 50% 100%, #2a0a4a 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, #0a0520 0%, #02010a 70%);
  }

  /* Aurora — 상하 색채 흐름 */
  .aurora-top, .aurora-bottom {
    position: fixed; left: 0; right: 0; height: 200px;
    z-index: 1; pointer-events: none;
    filter: blur(40px); opacity: 0.5;
  }
  .aurora-top {
    top: -100px;
    background: linear-gradient(180deg, transparent, #ff3838 30%, #b91c8a 70%, transparent);
    animation: auroraT 12s ease-in-out infinite alternate;
  }
  .aurora-bottom {
    bottom: -100px;
    background: linear-gradient(0deg, transparent, #4f46e5 30%, #8b5cf6 70%, transparent);
    animation: auroraB 14s ease-in-out infinite alternate;
  }
  @keyframes auroraT {
    0%   { transform: translateX(-30px) skewX(-5deg); opacity: 0.4; }
    100% { transform: translateX(30px) skewX(5deg);  opacity: 0.7; }
  }
  @keyframes auroraB {
    0%   { transform: translateX(40px) skewX(5deg);  opacity: 0.5; }
    100% { transform: translateX(-40px) skewX(-5deg); opacity: 0.3; }
  }

  /* ═════ Starfield (3 layers parallax) ═════ */
  .starfield { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .star {
    position: absolute; background: white; border-radius: 50%;
    animation: twinkle linear infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: var(--opc, 0.5); transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.5); }
  }

  /* Comet */
  .comet {
    position: fixed; z-index: 3; pointer-events: none;
    width: 2px; height: 2px; background: white; border-radius: 50%;
    box-shadow: 0 0 6px white, 0 0 12px white;
    animation: cometShoot 8s linear infinite;
  }
  .comet::after {
    content: ''; position: absolute; right: 100%; top: 50%; transform: translateY(-50%);
    width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8));
  }
  @keyframes cometShoot {
    0%   { top: -5%; left: 110%; opacity: 0; }
    8%   { opacity: 1; }
    20%  { top: 60%; left: -10%; opacity: 0; }
    100% { top: 60%; left: -10%; opacity: 0; }
  }

  /* ═════ Splash ═════ */
  .splash {
    position: fixed; inset: 0; z-index: 95;
    background: #02010a;
    display: flex; align-items: center; justify-content: center;
    animation: splashFade 0.8s ease-in 1.8s forwards;
  }
  @keyframes splashFade {
    to { opacity: 0; visibility: hidden; }
  }
  .splash-orb {
    width: 80px; height: 80px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff8888 0%, #d71617 50%, #4a0a0a 100%);
    box-shadow: 0 0 60px rgba(255,56,56,0.6),
                0 0 120px rgba(215,22,23,0.3),
                inset -8px -8px 30px rgba(0,0,0,0.5);
    animation: orbBirth 1.6s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes orbBirth {
    0%   { transform: scale(0); box-shadow: 0 0 0 transparent; }
    60%  { transform: scale(1.2); box-shadow: 0 0 100px rgba(255,56,56,0.9); }
    100% { transform: scale(1); }
  }

  /* ═════ Planet (인트로 메인) ═════ */
  .planet-stage {
    position: relative; width: 200px; height: 200px;
    margin: 0 auto;
    opacity: 0;
    animation: stageIn 1.4s cubic-bezier(.2,.8,.2,1) 1.9s forwards;
  }
  @keyframes stageIn {
    0%   { opacity: 0; transform: translateY(30px) scale(0.6); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .planet {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%,
      #ffaaaa 0%, #ff5757 25%, #d71617 55%, #5a0a0a 100%);
    box-shadow:
      0 0 60px rgba(255,56,56,0.5),
      0 0 120px rgba(215,22,23,0.25),
      inset -10px -15px 40px rgba(0,0,0,0.6),
      inset 8px 8px 20px rgba(255,200,200,0.2);
    animation: planetSpin 24s linear infinite;
  }
  @keyframes planetSpin {
    0%   { background-position: 0% 0%; }
    100% { background-position: 200% 0%; }
  }
  /* Orbit rings */
  .orbit {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) rotateX(70deg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50%;
  }
  .orbit-1 { width: 160px; height: 160px; animation: orbitRot 16s linear infinite; }
  .orbit-2 { width: 200px; height: 200px; animation: orbitRot 24s linear infinite reverse; border-color: rgba(255,87,87,0.15); }
  @keyframes orbitRot {
    to { transform: translate(-50%, -50%) rotateX(70deg) rotateZ(360deg); }
  }
  /* Orbit dots (4지표 별) */
  .orbit-dot {
    position: absolute; width: 6px; height: 6px; border-radius: 50%;
    background: white; box-shadow: 0 0 8px white, 0 0 16px rgba(255,255,255,0.6);
  }
  .orbit-dot.purchase { background: #60a5fa; box-shadow: 0 0 8px #60a5fa, 0 0 16px rgba(96,165,250,0.6); }
  .orbit-dot.contact  { background: #4ade80; box-shadow: 0 0 8px #4ade80, 0 0 16px rgba(74,222,128,0.6); }
  .orbit-dot.meeting  { background: #fbbf24; box-shadow: 0 0 8px #fbbf24, 0 0 16px rgba(251,191,36,0.6); }
  .orbit-dot.contract { background: #ff5757; box-shadow: 0 0 8px #ff5757, 0 0 16px rgba(255,87,87,0.6); }

  .orbit-1 .orbit-dot {
    left: 50%; top: 0;
    transform: translate(-50%, -50%);
  }

  /* ═════ Cosmic title ═════ */
  .cosmic-title {
    font-weight: 900;
    font-size: 48px;
    letter-spacing: -0.04em;
    background: linear-gradient(135deg, #fff 0%, #ff5757 60%, #ffaaaa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 40px rgba(255,87,87,0.4);
    opacity: 0;
    animation: titleWarp 1.2s cubic-bezier(.2,.8,.2,1) 2.5s forwards;
  }
  @keyframes titleWarp {
    0%   { opacity: 0; letter-spacing: 0.4em; transform: scale(0.9); filter: blur(8px); }
    100% { opacity: 1; letter-spacing: -0.04em; transform: scale(1); filter: blur(0); }
  }

  .subline {
    opacity: 0;
    animation: fadeUp 0.8s ease-out 2.9s forwards;
  }
  @keyframes fadeUp {
    0%   { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .label-orbitron {
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 0.15em;
  }

  /* ═════ Glass CTA with cosmic shimmer ═════ */
  .cta-cosmic {
    position: relative;
    background: linear-gradient(135deg, rgba(215,22,23,0.95) 0%, rgba(176,38,255,0.85) 100%);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 8px 32px rgba(215,22,23,0.4),
                0 0 0 1px rgba(255,255,255,0.1) inset,
                0 -4px 20px rgba(176,38,255,0.3) inset;
    opacity: 0;
    overflow: hidden;
    animation: fadeUp 0.8s ease-out 3.1s forwards,
               ctaPulse 2.8s ease-in-out 4.0s infinite;
  }
  @keyframes ctaPulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(215,22,23,0.4),
                            0 0 0 1px rgba(255,255,255,0.1) inset,
                            0 -4px 20px rgba(176,38,255,0.3) inset; }
    50%      { box-shadow: 0 12px 48px rgba(215,22,23,0.7),
                            0 0 0 1px rgba(255,255,255,0.3) inset,
                            0 -4px 30px rgba(176,38,255,0.5) inset;
                            transform: translateY(-2px); }
  }
  .cta-cosmic::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.4) 50%, transparent 70%);
    transform: translateX(-100%);
    animation: shimmer 4s ease-in-out 5s infinite;
  }
  @keyframes shimmer {
    0%, 100% { transform: translateX(-100%); }
    50%      { transform: translateX(100%); }
  }

  /* state */
  [data-state] { display: none; }
  [data-state].active { display: flex; }

  .state-nav {
    position: fixed; top: 8px; right: 8px; z-index: 100;
    background: rgba(0,0,0,.8); color: white; border-radius: 8px;
    padding: 6px 8px; font-size: 11px; display: flex; gap: 6px;
  }
  .state-nav button {
    background: rgba(255,255,255,.1); padding: 4px 8px; border-radius: 4px;
    color: white; font-weight: 600;
  }
  .state-nav button.active { background: #ff5757; }
</style>
</head>
<body>

<!-- Cosmic background layers -->
<div class="space-bg"></div>
<div class="aurora-top"></div>
<div class="aurora-bottom"></div>
<div class="starfield" id="starfield"></div>
<div class="comet" style="animation-delay: 2s;"></div>
<div class="comet" style="animation-delay: 6s;"></div>

<!-- Splash -->
<div class="splash" id="splash">
  <div class="splash-orb"></div>
</div>

<!-- State nav -->
<nav class="state-nav">
  <button onclick="location.reload()" style="background:rgba(255,255,255,.2);">↻</button>
  <button data-go="login" class="active">1) 인트로</button>
  <button data-go="claim">2) Claim</button>
</nav>

<!-- ═══════════════════════════════════════════════════════════
     STATE 1: 인트로 (Cosmic)
     ═══════════════════════════════════════════════════════════ -->
<main data-state="login" class="active relative z-10 min-h-dvh flex flex-col items-center justify-center px-6 text-center">
  <div class="w-full max-w-sm">

    <!-- Logo (작게, 위에) -->
    <div class="mb-2 flex justify-center" style="opacity:0; animation: fadeUp 0.8s 2.0s forwards;">
      <img src="../../../public/salespt-logo.png"
           alt="세일즈PT"
           class="h-10 w-auto object-contain opacity-90"
           onerror="this.outerHTML='<div style=&quot;width:60px;height:32px;border-radius:8px;background:linear-gradient(135deg,#d71617,#ff6b6b);display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:11px;&quot;>SalesPT</div>'">
    </div>

    <!-- Planet stage (orbit + planet + 4 metric stars) -->
    <div class="planet-stage">
      <div class="orbit orbit-2"></div>
      <div class="orbit orbit-1">
        <div class="orbit-dot purchase"></div>
      </div>
      <div class="orbit orbit-1" style="animation-delay: -4s;">
        <div class="orbit-dot contact"></div>
      </div>
      <div class="orbit orbit-1" style="animation-delay: -8s;">
        <div class="orbit-dot meeting"></div>
      </div>
      <div class="orbit orbit-1" style="animation-delay: -12s;">
        <div class="orbit-dot contract"></div>
      </div>
      <div class="planet"></div>
    </div>

    <!-- Cosmic title -->
    <h1 class="cosmic-title mt-8 mb-2">경영일지</h1>

    <p class="subline label-orbitron text-[11px] text-white/50 mb-1.5">SALESPT · 7TH BATCH</p>
    <p class="subline text-sm font-medium text-white/80 mb-10" style="animation-delay: 3.0s;">
      매일의 <span class="brand-red font-bold">4가지 별</span>이 모여
      당신의 <span class="brand-red font-bold">사업 궤도</span>가 됩니다
    </p>

    <!-- Cosmic CTA -->
    <button class="cta-cosmic w-full inline-flex items-center justify-center gap-3 rounded-2xl px-5 py-4 text-sm font-bold text-white">
      <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" opacity=".75"/>
        <path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" opacity=".55"/>
        <path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      <span>Google 계정으로 시작하기</span>
    </button>

    <p class="subline mt-6 text-[11px] text-white/40" style="animation-delay: 3.4s;">
      트레이너에게 받은 링크로 접속하셨나요?
    </p>
  </div>
</main>

<!-- ═══════════════════════════════════════════════════════════
     STATE 2: Claim
     ═══════════════════════════════════════════════════════════ -->
<main data-state="claim" class="relative z-10 min-h-dvh flex flex-col items-center justify-center px-6">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-black mb-1">새로운 궤도 진입 🪐</h1>
      <p class="text-sm text-white/60">본인의 기수와 이름을 알려주세요.</p>
    </div>

    <div class="rounded-2xl border border-white/10 backdrop-blur-md p-5"
         style="background: linear-gradient(180deg, rgba(255,87,87,0.08) 0%, rgba(176,38,255,0.04) 100%);
                box-shadow: 0 20px 60px rgba(215,22,23,0.2), 0 0 0 1px rgba(255,255,255,0.05) inset;">
      <div class="mb-5 flex items-center gap-2 rounded-lg border border-blue-400/20 px-3 py-2 text-xs text-blue-200"
           style="background: rgba(96,165,250,0.08);">
        <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
        <span class="font-medium truncate">belief@gmail.com 으로 로그인됨</span>
      </div>

      <label class="label-orbitron block text-[10px] font-bold text-white/50 mb-1.5">BATCH</label>
      <select class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2.5 text-sm text-white focus:border-red-400 focus:outline-none mb-4">
        <option value="" class="bg-gray-900">기수를 선택하세요</option>
        <option value="6" class="bg-gray-900">6기</option>
        <option value="7" selected class="bg-gray-900">7기</option>
      </select>

      <label class="label-orbitron block text-[10px] font-bold text-white/50 mb-1.5">NAME</label>
      <select class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2.5 text-sm text-white focus:border-red-400 focus:outline-none">
        <option class="bg-gray-900">7기 명단에서 본인을 선택</option>
        <option class="bg-gray-900">김OO</option>
        <option class="bg-gray-900">박OO</option>
        <option class="bg-gray-900">이OO</option>
        <option class="bg-gray-900">최OO</option>
        <option class="bg-gray-900">정OO</option>
        <option class="bg-gray-900">강OO</option>
        <option class="bg-gray-900">조OO</option>
        <option class="bg-gray-900">윤OO</option>
      </select>

      <p class="mt-3 text-[11px] text-white/40 leading-relaxed">
        목록에 본인 이름이 없다면 트레이너에게 문의해 주세요.
      </p>

      <button class="cta-cosmic w-full mt-5 rounded-xl px-5 py-3 text-sm font-bold text-white">
        궤도 진입 →
      </button>
    </div>

    <div class="mt-4 text-center">
      <button class="text-xs text-white/40 hover:text-white/70 underline-offset-2 hover:underline">
        다른 Google 계정으로 로그인
      </button>
    </div>
  </div>
</main>

<script>
  // Starfield
  const sf = document.getElementById('starfield');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() < 0.85 ? (1 + Math.random() * 1.5) : (2 + Math.random() * 2);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 100) + '%';
    s.style.setProperty('--opc', String(0.3 + Math.random() * 0.5));
    s.style.opacity = String(0.3 + Math.random() * 0.5);
    s.style.animationDuration = (2 + Math.random() * 4) + 's';
    s.style.animationDelay = (Math.random() * 4) + 's';
    sf.appendChild(s);
  }

  // State toggle
  document.querySelectorAll('.state-nav button[data-go]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.go;
      document.querySelectorAll('[data-state]').forEach((s) => {
        s.classList.toggle('active', s.dataset.state === target);
      });
      document.querySelectorAll('.state-nav button[data-go]').forEach((b) => {
        b.classList.toggle('active', b.dataset.go === target);
      });
    });
  });
</script>
</body>
</html>
